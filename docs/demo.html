<style>

:root[data-theme="dark"]{--g:#14161b;--g2:#1c1f26;--ink:#e6e9ef;--mute:#8b93a3;--line:#2a2e38;--acc:#7d9bff;--acc-ink:#0b0d12;--frame:#31353f;--shadow:0 20px 50px rgba(0,0,0,.5)}
*{box-sizing:border-box}

main{overflow:auto;position:relative}

.cap{width:100%;max-width:1280px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.cap b{font:600 15px/22px var(--sans)}
.cap code{font:12px/20px var(--mono);color:var(--mute)}
.cap .try{color:var(--mute);font-size:13px}
.cap .try:before{content:'Try: ';color:var(--ink);font-weight:500}
.cap{flex-direction:column;gap:2px;align-items:flex-start}
.cap .flow{font:600 11px/16px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.cap .flow span{font-family:var(--mono);font-weight:400;letter-spacing:0;margin-right:6px}
.cap .why{color:var(--ink);max-width:70ch}
.bar{display:none;gap:8px;padding:12px 16px 0;align-items:center}
.bar select{flex:1;min-width:0;font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--g2);color:var(--ink)}
.bar button{font:inherit;min-height:40px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--g2);color:var(--ink);cursor:pointer}
.dev{position:relative;border-radius:14px;background:var(--frame);padding:10px;box-shadow:var(--shadow);flex:none}
.dev.phone{border-radius:44px;padding:12px}
.dev .win{overflow:hidden;border-radius:6px;background:#fff}
.dev.phone .win{border-radius:34px}
.dev iframe{border:0;display:block;transform-origin:0 0;background:#fff}

.card{display:block;text-align:left;border:0;background:none;color:inherit;cursor:pointer;padding:0;font:inherit}

.card .win{overflow:hidden;border-radius:4px;background:#fff;position:relative}
.card .win:after{content:'';position:absolute;inset:0}
.card iframe{border:0;display:block;transform-origin:0 0;pointer-events:none;background:#fff}
.card.phone .shot{width:max-content;border-radius:22px;padding:6px}
.card.phone .win{border-radius:18px}
.card b{display:block;margin:10px 0 0;font-weight:500}
.card small{color:var(--mute);font-size:12px}
.card:hover .shot{outline:2px solid var(--acc)}
@media (max-width:900px){body{grid-template-columns:1fr}nav{display:none}.bar{display:flex}#stage{padding:16px 16px 40px}header .k{display:none}header{gap:10px;padding:0 12px}}

const DOCS = {"console":"<!doctype html>\n<html lang=\"en\">\n  <head>\n    <meta charset=\"utf-8\" />\n    <meta name=\"viewport\" content=\"width=device-width,initial-scale=1\" />\n    <meta name=\"robots\" content=\"noindex,nofollow\" />\n    <title>Vantage</title>\n    <link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap\"><style>/* Vantage design tokens. Spec: design/DESIGN-SYSTEM.md */\n:root {\n  --bg: #f7f7f8;\n  --bg-2: #eff0f1;\n  --panel: #fff;\n  --ink: #181a1b;\n  --muted: #697077;\n  --muted-2: #838a91;\n  --placeholder: #9ea3a9;\n  --disabled: #b9bdc1;\n  --line: #e9ebec;\n  --line-strong: #d4d6d9;\n  --accent: #2d68a2;\n  --accent-ink: #fff;\n  --accent-soft: #eff5fb;\n  --danger: #e95050;\n  --ok: #4db24d;\n  --warn: #eb763c;\n  --ok-bg: #e4f4e4;\n  --warn-bg: #fdeee5;\n  --warn-ink: #b4501d;\n  --danger-bg: #fce5e5;\n  --shadow-card: 0 1px 40px rgba(0, 0, 0, 0.05);\n  --s1: 4px;\n  --s2: 8px;\n  --s3: 12px;\n  --s4: 16px;\n  --s5: 20px;\n  --s6: 24px;\n  --s7: 32px;\n  --s8: 48px;\n  --s9: 64px;\n  --gutter: 20px;\n  --gutter-b: 32px;\n  --safe-b: env(safe-area-inset-bottom, 0px);\n  --control-h: 36px;\n  --control-h-sm: 28px;\n  --touch: 44px;\n  --r-control: 6px;\n  --r-card: 8px;\n  --r-sheet: 12px;\n  --r-pill: 99px;\n  --icon-gap: 6px; /* icon to label inside a button: a touch more than a word space, so the icon reads as its own thing */\n  --form-w: 640px;\n  --page-w: 1100px;\n  --panel-w: 340px;\n  --font: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;\n  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;\n}\n@media (max-width: 700px) {\n  :root {\n    --gutter: 16px;\n  }\n}\n@media (prefers-color-scheme: dark) {\n  :root {\n    --bg: #131516;\n    --bg-2: #1e2124;\n    --panel: #191c1e;\n    --ink: #eceeef;\n    --muted: #a0a6ac;\n    --muted-2: #868d93;\n    --placeholder: #6f767c;\n    --disabled: #4d or: transparent;\n}\n.btn.danger {\n  color: var(--danger);\n}\n.btn.small {\n  height: var(--control-h-sm);\n  padding: 0 var(--s3);\n  font-size: 12px;\n}\n/* reveal: the icon alone at rest; on hover or focus the label slides out while the icon turns twice. Pointers only:\n   on touch screens and narrow layouts the label is always shown, and reduced motion drops the turn. */\n.btn.reveal > span {\n  display: inline-block;\n  overflow: hidden;\n  white-space: nowrap;\n}\n@media (hover: hover) and (pointer: fine) and (min-width: 701px) {\n  .btn.reveal {\n    padding: 0 10px;\n  }\n  .btn.reveal > span {\n    max-width: 0;\n    opacity: 0;\n    transition:\n      max-width 0.35s ease,\n      opacity 0.25s ease,\n      margin-left 0.35s ease;\n    margin-left: calc(-1 * var(--icon-gap));\n  }\n  .btn.reveal > svg.i {\n    transition: transform 0.6s cubic-bezier(0.2, 0.7, 0.2, 1);\n  }\n  .btn.reveal:hover > span,\n  .btn.reveal:focus-visible > span {\n    max-width: 12ch;\n    opacity: 1;\n    margin-left: 0;\n  }\n  .btn.reveal:hover > svg.i,\n  .btn.reveal:focus-visible > svg.i {\n    transform: rotate(720deg);\n  }\n  .btn.reveal:hover,\n  .btn.reveal:focus-visible {\n    padding: 0 var(--s4) 0 12px;\n  }\n}\n@media (prefers-reduced-motion: reduce) {\n  .btn.reveal > span,\n  .btn.reveal > svg.i {\n    transition: none;\n  }\n  .btn.reveal:hover > svg.i,\n  .btn.reveal:focus-visible > svg.i {\n    transform: none;\n  }\n}\n.btn:disabled {\n  opacity: 0.5;\n  cursor: default;\n}\n.btn:focus-visible,\ninput:focus-visible,\nselect:focus-visible,\ntextarea:focus-visible {\n  outline: 2px solid var(--accent);\n  outline-offset: 1px;\n}\ninput[type='text'],\ninput[type='password'],\ninput[type='number'],\ninput[type='email'],\nselect {\n  width: 100%;\n  height: var(--control-h);\n  padding: 0 var(--s3);\n  border: 1px solid var(--line-strong);\n  border-radius: var(--r-control);\n  background: var(--panel);\n  color: var(--ink);\n}\ntextarea {\n  width: 100%;\n  min-height: 96px;\n  padding: var(--s2) var(--s3);\n  border: 1px solid var(--line-strong);\n  border-radius: var(--r-control);\n  background: var(--panel);\n  color: var(--ink);\n  resize: vertical;\n  font-family: var(--font);\n  line-height: 20px;\n}\n.field {\n  display: flex;\n  flex-direction: column;\n  gap: var(--s1);\n}\n.field > label {\n  font-size: 12px;\n  line-height: 16px;\n  font-weight: 500;\n  color: var(--muted);\n  margin: 0;\n}\n.hint {\n  font-size: 12px;\n  line-height: 16px;\n  color: var(--muted);\n}\n.stack {\n  display: flex;\n  flex-direction: column;\n  gap: var(--s4);\n}\n.section {\n  display: flex;\n  flex-direction: column;\n  gap: var(--s4);\n}\n.section > h3 {\n  font-size: 16px;\n  line-height: 24px;\n  font-weight: 600;\n  margin: 0;\n}\n.cols2 {\n  display: grid;\n  grid-template-columns: repeat(2, minmax(0, 1fr));\n  gap: var(--s4);\n}\n@media (max-width: 640px) {\n  .cols2 {\n    grid-template-columns: minmax(0, 1fr);\n  }\n}\n.row {\n  display: flex;\n  gap: var(--s2);\n  align-items: center;\n  flex-wrap: wrap;\n}\n.row.end {\n  justify-content: flex-end;\n}\n.check {\n  display: flex;\n  align-items: flex-start;\n  gap: var(--s2);\n  font-size: 13px;\n  line-height: 20px;\n}\n.check input {\n  width: 16px;\n  height: 16px;\n  margin: 2px 0 0;\n  accent-color: var(--accent);\n  flex: none;\n}\n.seg {\n  display: inline-flex;\n  align-self: flex-start;\n  padding: 2px;\n  gap: 2px;\n  border: 1px solid var(--line);\n  border-radius: var(--r-pill);\n  background: var(--bg);\n}\n.seg button {\n  height: 24px;\n  padding: 0 var(--s3);\n  border: 0;\n  border-radius: var(--r-pill);\n  background: transparent;\n  color: var(--muted);\n  cursor: pointer;\n  font-size: 13px;\n  font-weight: 500;\n  line-height: 24px;\n}\n.seg button.on {\n  background: var(--panel);\n  color: var(--ink);\n  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);\n}\n/* navigation + footer */\n.nav {\n  height: 48px;\n  display: flex;\n  align-items: center;\n  gap: va se), feedback: fb, events: rows, audit: al }) : text(200, R.report(share, fb, rows, al), 'text/markdown');\n    return json(405, { error: 'Method not allowed' });\n  }\n\n  // Tester side: one session, for the share the screen names.\n  const sess = { consent: S.consent === undefined ? null : S.consent, passcodeOk: false };\n  function viewerRoute(method, p, q, body) {\n    const m = p.match(/^\\/p\\/([\\w-]+)\\/_vantage\\/(.+)$/);\n    if (!m) return json(404, { error: 'Not found' });\n    const share = shares[m[1]];\n    if (!share) return json(404, { error: 'Not found' });\n    const ep = m[2];\n    const v = share.viewers[S.viewerId] || Object.values(share.viewers)[0];\n    if (ep === 'meta') {\n      const intro = share.intro;\n      return json(200, {\n        name: share.name,\n        sharedBy: ME,\n        abuseEmail: 'security@lumen.example',\n        tasks: share.tasks,\n        entry: share.entry,\n        watermark: share.watermark,\n        recordSessions: share.recordSessions,\n        requireConsent: share.requireConsent,\n        consent: sess.consent,\n        viewer: { name: v.name, email: v.email },\n        expiresAt: iso(share.expiresAt),\n        hasBundle: !!share.files,\n        mode: share.mode,\n        showTasks: share.showTasks !== false,\n        voice: !!share.voice,\n        screen: !!share.screen,\n        recordText: !!share.recordText,\n        voiceActive: false,\n        contentOrigin: window.origin,\n        intro: { kind: intro.kind, text: intro.kind === 'default' ? '' : intro.text, media: null, subtitles: [] },\n      });\n    }\n    if (ep === 'content') return json(200, { html: window.__PROTOTYPE__ });\n    if (ep === 'consent') {\n      sess.consent = !!body.accept;\n      return json(200, { consent: sess.consent });\n    }\n    if (ep === 'events') return json(200, { ok: (body || []).length });\n    if (ep.startsWith('recording')) return json(200, { ok: true, seq: +q.seq || 0 });\n    if (ep === 'feedback') {\n      if (share.mode === 'view') return json(403, { error: 'This share is view only' });\n      const rec = { ts: iso(Date.now()), kind: body.kind === 'task' ? 'task' : 'feedback', viewer: v.name, email: v.email, session: 'live', text: String(body.text || ''), location: String(body.location || '') };\n      if (rec.kind === 'task') {\n        rec.taskIndex = +body.taskIndex;\n        rec.result = ['done', 'answer'].includes(body.result) ? body.result : 'stuck';\n      }\n      feedback[share.id].push(rec);\n      return json(201, { ok: true });\n    }\n    return json(404, { error: 'Unknown endpoint' });\n  }\n\n  function route(method, url, body) {\n    const u = new URL(url, 'http://x');\n    const q = Object.fromEntries(u.searchParams);\n    if (u.pathname === '/api/auth') return json(200, { serverToken: true, google: true, sso: false, ssoEmail: null, ssoAdmin: false, ssoLogoutUrl: null });\n    if (u.pathname.startsWith('/api/')) return adminRoute(method, u.pathname.slice(4), q, body);\n    if (u.pathname.startsWith('/p/')) return viewerRoute(method, u.pathname, q, body);\n    return json(404, { error: 'Not found' });\n  }\n  const parse = (b) => {\n    if (b == null || b === '') return {};\n    try {\n      return JSON.parse(b);\n    } catch {\n      return {};\n    }\n  };\n  const wait = (ms) => new Promise((k) => setTimeout(k, ms));\n  window.fetch = async (url, opts = {}) => {\n    await wait(LATENCY);\n    if (opts.headers && opts.headers.Authorization) signedIn = true; // any pasted token signs the demo in\n    let r;\n    try {\n      r = route((opts.method || 'GET').toUpperCase(), String(url), parse(opts.body));\n    } catch (e) {\n      r = json(e.status || 500, { error: e.error || e.message || 'Internal error' });\n    }\n    if (r.blob) {\n      const b = await r.blob;\n      return new Response(b, { status: 200, headers: { 'content-type': b.type } });\n    }\n    return new Response(r.body, { status: r.status, headers: { 'content-type': r.type } });\n  };\n  //    /* storage blocked: the token form still works */\n  }\n  window.__DEMO__ = { shares, checkout, sess, signIn: () => (signedIn = true) };\n  document.addEventListener('DOMContentLoaded', () => {\n    // Links the console would open on the real server: docs, Google sign-in.\n    document.addEventListener('click', (e) => {\n      const a = e.target.closest && e.target.closest('a[href]');\n      if (!a) return;\n      const h = a.getAttribute('href');\n      if (h === '/auth/google') {\n        e.preventDefault();\n        signedIn = true;\n        window\n          .fetch('/api/me')\n          .then((r) => r.json())\n          .then((m) => {\n            me = m; // eslint-disable-line no-undef\n            render(); // eslint-disable-line no-undef\n          });\n      } else if (h.startsWith('/docs/') || h.startsWith('/p/')) {\n        e.preventDefault();\n        if (typeof toast === 'function') toast('In the demo this opens nothing. On a real vantage it opens ' + h + '.'); // eslint-disable-line no-undef\n      }\n    });\n  });\n})();\n<\/script></head>\n  <body>\n    <div id=\"app\"></div>\n    <div class=\"toast\" id=\"toast\" role=\"status\" aria-live=\"polite\"></div>\n    <!-- One file per page. core.js holds shared helpers and the router and must load first; boot runs on DOMContentLoaded. -->\n    <script>'use strict';\n// Console: shared helpers, session state, the shell (nav + footer) and the page router.\n// Pages live in the other files under /admin/ and are plain functions the router calls.\n/* exported $, esc, fmt, ic, count, toast, api, copy, download, blobUrl, b64, filesFromDrop, uploadXhr, stopLive,\n   shell, wireShell, ask, signOut, render, rel */\n/* global renderLogin, renderLeft, renderList, renderNew, renderShare, renderServer, renderAccount */\n\nconst $ = (s, r) => (r || document).querySelector(s);\nconst esc = (s) =>\n  String(s == null ? '' : s).replace(\n    /[&<>\"']/g,\n    (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#39;' })[c]\n  );\nconst fmt = (t) => (t ? new Date(t).toLocaleString() : '—');\nconst rel = (t) => {\n  const d = (new Date(t) - Date.now()) / 864e5;\n  if (d < 0) return 'expired';\n  if (d < 1) return 'in ' + Math.round(d * 24) + 'h';\n  if (d < 60) return 'in ' + Math.round(d) + ' days';\n  return 'in ' + Math.round(d / 30) + ' months';\n};\n\nconst ICON = {\n  lock: '<rect x=\"4\" y=\"11\" width=\"16\" height=\"10\" rx=\"2\"></rect><path d=\"M8 11V7a4 4 0 0 1 8 0v4\"></path>',\n  people:\n    '<circle cx=\"9\" cy=\"8\" r=\"3.5\"></circle><path d=\"M2.5 20a6.5 6.5 0 0 1 13 0\"></path>' +\n    '<path d=\"M16 4.5a3.5 3.5 0 0 1 0 7\"></path><path d=\"M17.5 13.5A6.5 6.5 0 0 1 21.5 20\"></path>',\n  eye: '<path d=\"M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6z\"></path><circle cx=\"12\" cy=\"12\" r=\"3\"></circle>',\n  download: '<path d=\"M12 3v12M6 11l6 6 6-6M4 21h16\"></path>',\n  play: '<path d=\"M7 4l12 8-12 8z\"></path>',\n  x: '<path d=\"M6 6l12 12M18 6L6 18\"></path>',\n  plus: '<path d=\"M12 5v14M5 12h14\"></path>',\n  screen: '<rect x=\"3\" y=\"4\" width=\"18\" height=\"13\" rx=\"2\"></rect><path d=\"M8 21h8M12 17v4\"></path>',\n};\nconst ic = (n, cls = '') => `<svg class=\"i ${cls}\" viewBox=\"0 0 24 24\" aria-hidden=\"true\">${ICON[n]}</svg>`;\nconst count = (n, icon, word) =>\n  `<span class=\"count\" title=\"${n} ${word}${n === 1 ? '' : 's'}\">${ic(icon)}<b>${n}</b></span>`;\n\n// ---- session state shared by every page ----\nlet token = sessionStorage.getItem('vantage_token') || '';\nlet me = null;\nlet view = { page: 'list' };\nlet liveTimer = null;\nlet left = null;\n\n// A signed-in link (printed when the server starts) carries the token in the URL fragment, which never reaches the\n// server or its logs. Use it once and drop it from the address bar. Also handled on hashchange, for a pasted link.\nfunction tokenFromHash() {\n  const m = location.hash.match(/(?:^#|&)token=([^&]+)/);\n  if (!m) return false;\n  token = decodeURIComponent(m[1]);\n  sessionStorage.setItem('vantage_token', token);\n  history.replaceState(null, '', location.pathname);\n  return true;\n}\n\nfunction toast(m, ms) {\n  const t = $('#toast');\n  t.innerHTML = '<span></span><button type=\"button\" class=\"x\" aria-label=\"Dismiss\">×</button>';\n  t.firstChild.textContent = m;\n  t.classList.add('show');\n  clearTimeout(t._h);\n  const hide = () => t.classList.remove('show');\n  t._h = setTimeout(hide, ms || Math.min(8000, Math.max(3000, 1000 + m.length * 50)));\n  t.lastChild.onclick = hide;\n  t.onmouseenter = () => clearTimeout(t._h);\n  t.onmouseleave = () => {\n    t._h = setTimeout(hide, 1500);\n  };\n}\n\n// Bearer header only when there is a token; a Google session rides on its cookie.\nconst authHeaders = () => (token ? { Authorization: 'Bearer ' + token } : {});\n\nasync function api(path, opts = {}) {\n  const r = await fetch('/api' + path, {\n    ...opts,\n    headers: { 'Content-Type': 'application/json', ...authHeaders(), ...(opts.headers || {}) },\n  });\n  if (r.status === 401) {\n    const had = !!me;\n    me = null;\n    if (had) render();\n    throw new Error('Unauthorized');\n  }\n  const ct = r.headers.get('content-type') || '';\n  const body = ct.includes('json') ? await r.json() : await r.text();\n  if (!r.ok) throw new Error(body.error || r.statusText);\n  return body;\n}\nasync function copy(t) {\n  try {\n    await navigator.clipboard.writeText(t);\n    toast('Copied');\n  } catch {\n    prompt('Copy this link', t);\n  }\n}\nasync function download(path, name) {\n  const r = await fetch('/api' + path, { headers: authHeaders() });\n  if (!r.ok) {\n    alert('Export failed');\n    return;\n  }\n  const a = document.createElement('a');\n  a.href = URL.createObjectURL(await r.blob());\n  a.download = name;\n  a.click();\n}\nasync function blobUrl(path) {\n  const r = await fetch('/api' + path, { headers: authHeaders() });\n  return URL.createObjectURL(await r.blob());\n}\nfunction b64(u8) {\n  let s = '';\n  for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));\n  return btoa(s);\n}\n// Reads a dropped folder tree into [{path, file}].\nfunction walk(entry, prefix, out) {\n  return new Promise((res) => {\n    if (entry.isFile) {\n      entry.file((f) => {\n        out.push({ path: prefix + f.name, file: f });\n        res();\n      });\n      return;\n    }\n    const reader = entry.createReader();\n    const all = [];\n    const read = () =>\n      reader.readEntries(async (es) => {\n        if (!es.length) {\n          for (const e of all) await walk(e, prefix + entry.name + '/', out);\n          res();\n        } else {\n          all.push(...es);\n          read();\n        }\n      });\n    read();\n  });\n}\nasync function filesFromDrop(e) {\n  // The item list empties as soon as this handler yields, so every entry is taken before the first await.\n  const items = [...(e.dataTransfer.items || [])].map((it) => ({\n    entry: it.webkitGetAsEntry && it.webkitGetAsEntry(),\n    file: it.kind === 'file' ? it.getAsFile() : null,\n  }));\n  const files = [];\n  for (const it of items) {\n    if (it.entry) await walk(it.entry, '', files);\n    else if (it.file) files.push({ path: it.file.name, file: it.file });\n  }\n  if (!files.length) for (const f of e.dataTransfer.files) files.push({ path: f.name, file: f });\n  return files;\n}\n// Raw upload (media, subtitles) with progress; fetch has no upload progress.\nfunction uploadXhr(method, path, file, headers, onProgress) {\n  return new Promise((res, rej) => {\n    const x = new XMLHttpRequest();\n    x.open(method, '/api' + path);\n    if (token) x.setRequestHeader('Authorization', 'Bearer ' + token);\n    for (const k in headers) x.setRequestHeader(k, headers[k]);\n    x.upload.onprogress = (e) => {\n      if (e.lengthComputable && onProgress) onProgress(e.loaded / e.total);\n    };\n    x.onload = () => {\n      let b = {};\n      try {\n        b = JSON.parse(x.responseText);\n      } catch {\n        /* not json */\n      }\n      if (x.status >= 200 && x.status < 300) res(b);\n      else rej(new Error(b.error || x.statusText));\n    };\n    x.onerror = () => rej(new Error('Upload failed'));\n    x.send(file);\n  });\n}\nfunction stopLive() {\n  if (liveTimer) {\n    clearInterval(liveTimer);\n    liveTimer = null;\n  }\n}\n\n// ---- shell: nav + footer around every signed-in page ----\nconst initials = (w) => {\n  const s = String(w || '')\n    .replace(/@.*/, '')\n    .replace(/[._-]+/g, ' ')\n    .trim()\n    .split(' ')\n    .filter(Boolean);\n  return s.length ? (s[0][0] + (s[1] ? s[1][0] : '')).toUpperCase() : 'A';\n};\nfunction shell(content, active) {\n  const link = (page, label) => `<a href=\"#\" data-nav=\"${page}\" class=\"${active === page ? 'on' : ''}\">${label}</a>`;\n  const status = me.server.encryptionAtRest\n    ? 'Encrypted at rest'\n    : '<span style=\"color:var(--warn)\">Not encrypted at rest</span>';\n  const tagline = me.server.google ? '' : ' · self-hosted, nothing leaves this server';\n  return `\n    <nav class=\"nav\">\n      <a class=\"brand\" href=\"#\" data-nav=\"list\">${ic('lock', 'lg')}Vantage</a>\n      <div class=\"links\">${link('list', 'Prototypes')}${link('new', 'New Share')}${link('server', 'Server')}</div>\n      <span class=\"spacer\"></span>\n      <span class=\"hint\">${status} · ${me.server.sso ? 'SSO' : 'personal links'}</span>\n      <a href=\"#\" class=\"me ${active === 'account' ? 'on' : ''}\" data-nav=\"account\" title=\"Account\">\n        <span class=\"avatar\">${esc(initials(me.identity.who))}</span><span>${esc(me.identity.who)}</span>\n      </a>\n    </nav>\n    <div class=\"wrap\">\n      <div class=\"content\">${content}</div>\n      <footer class=\"footer\">\n        <span>Vantage ${esc(me.server.version)}${tagline}</span>\n        <span class=\"spacer\"></span>\n        <a href=\"/docs/readme\" target=\"_blank\">Help</a>\n        <a href=\"/docs/security\" target=\"_blank\">Security overview</a>\n        <a href=\"/docs/deployment\" target=\"_blank\">Deployment</a>\n        <a href=\"/docs/limits\" target=\"_blank\">What it cannot do</a>\n        <a href=\"/docs/testing\" target=\"_blank\">How it was checked</a>\n        <a href=\"/docs/design-system\" target=\"_blank\">Design system</a>\n      </footer>\n    </div>`;\n}\nfunction wireShell() {\n  document.querySelectorAll('[data-nav]').forEach((a) => {\n    a.onclick = (e) => {\n      e.preventDefault();\n      view = { page: a.dataset.nav };\n      render();\n    };\n  });\n}\n// Confirm dialog for anything that cannot be undone. Resolves true when the action button is pressed.\nfunction ask(title, body, okLabel, danger) {\n  return new Promise((res) => {\n    const m = document.createElement('div');\n    m.className = 'modal';\n    m.innerHTML = `\n      <div class=\"card\" role=\"dialog\" aria-modal=\"true\">\n        <h1>${title}</h1>\n        <div class=\"mbody\"><p>${body}</p></div>\n        <div class=\"mfoot\">\n          <button class=\"btn\" id=\"mNo\">Cancel</button>\n          <button class=\"btn ${danger ? 'danger' : 'primary'}\" id=\"mYes\">${esc(okLabel)}</button>\n        </div>\n      </div>`;\n    document.body.appendChild(m);\n    const done = (v) => {\n      m.remove();\n      res(v);\n    };\n    m.querySelector('#mNo').onclick = () => done(false);\n    m.querySelector('#mYes').onclick = () => done(true);\n    m.onclick = (e) => {\n      if (e.target === m) done(false);\n    };\n    m.querySelector('#mYes').focus();\n  });\n}\nasync function signOut() {\n  if (me && me.identity.kind === 'google') {\n    try {\n      await api('/logout', { method: 'POST' });\n    } catch {\n      /* already gone */\n    }\n  }\n  sessionStorage.removeItem('vantage_token');\n  token = '';\n  me = null;\n  render();\n}\n\n// ---- router ----\nfunction render() {\n  stopLive();\n  const app = $('#app');\n  window.scrollTo(0, 0);\n  if (left) return renderLeft(app);\n  if (!me) return renderLogin(app);\n  const pages = { list: renderList, new: renderNew, share: renderShare, server: renderServer, account: renderAccount };\n  return (pages[view.page] || renderList)(app);\n}\n\ntokenFromHash();\nwindow.addEventListener('hashchange', async () => {\n  if (!tokenFromHash()) return;\n  try {\n    me = await api('/me');\n  } catch {\n    token = '';\n  }\n  view = { page: 'list' };\n  render();\n});\ndocument.addEventListener('DOMContentLoaded', async () => {\n  try {\n    me = await api('/me');\n  } catch {\n    token = '';\n  }\n  render();\n});\n<\/script>\n    <script>'use strict';\n// Form pieces shared by New share and a share's Settings tab: the task editor, the purpose toggle, the option\n// switches, and the \"Before you start\" intro editor.\n/* exported taskEditor, wireTaskEditor, taskValue, modeSeg, wireModeSeg, modeValue, optionChecks, wireOptions,\n   optionValues, introEditor, wireIntroEditor, introValue, uploadIntro */\n/* global $, esc, ic, toast, api, uploadXhr, render */\n\n// ---- tasks and questions: a title, an optional description and a \"when\" rule, laid out like a form builder ----\nconst WHEN = { start: 'At the start', after: 'After task…', screen: 'On screen…', minutes: 'After … minutes' };\nconst WHEN_PLACEHOLDER = { after: 'task #', screen: '#checkout', minutes: '5', start: '' };\n\nfunction taskRow(t) {\n  t = t || { text: '', description: '', kind: 'task', when: { type: 'start', value: '' } };\n  const options = Object.entries(WHEN)\n    .map(([k, v]) => `<option value=\"${k}\" ${t.when.type === k ? 'selected' : ''}>${v}</option>`)\n    .join('');\n  const title =\n    t.kind === 'question'\n      ? 'Question, e.g. What did you expect to happen here?'\n      : 'Task, e.g. Find the price of the annual plan';\n  return `\n    <div class=\"taskcard\">\n      <div class=\"head\">\n        <input type=\"text\" class=\"tt\" value=\"${esc(t.text)}\" placeholder=\"${title}\" aria-label=\"Title\">\n        <select class=\"tk\" aria-label=\"Kind\">\n          <option value=\"task\" ${t.kind === 'task' ? 'selected' : ''}>Task</option>\n          <option value=\"question\" ${t.kind === 'question' ? 'selected' : ''}>Question</option>\n        </select>\n      </div>\n      <textarea class=\"td\" aria-label=\"Description\" placeholder=\"Description (optional): where to start, what counts as done, anything the tester should know\">${esc(t.description || '')}</textarea>\n      <div class=\"foot\">\n        <span class=\"hint\">Show it</span>\n        <select class=\"tw\" aria-label=\"When it appears\">${options}</select>\n        <input type=\"text\" class=\"tv\" value=\"${esc(t.when.type === 'after' ? t.when.value + 1 : (t.when.value ?? ''))}\" placeholder=\"${WHEN_PLACEHOLDER[t.when.type]}\"\n          ${t.when.type === 'start' ? 'disabled' : ''} aria-label=\"When: value\">\n        <span></span>\n        <button type=\"button\" class=\"rm\" title=\"Remove\">${ic('x')}</button>\n      </div>\n    </div>`;\n}\nfunction taskEditor(tasks) {\n  return `\n    <div class=\"field\">\n      <label>Tasks and questions for testers</label>\n      <div class=\"stack\" id=\"tasks\" style=\"gap:var(--s4)\">${tasks.map(taskRow).join('')}</div>\n      <div class=\"row\">\n        <button type=\"button\" class=\"btn small\" id=\"taskAdd\">${ic('plus')}Add</button>\n        <span class=\"hint\">A task gets Completed / Couldn't buttons; a question gets a text answer. \"Show it\" says when\n          it appears: at the start, after another task, when the tester reaches a screen (the page path or #hash), or\n          after a number of minutes.</span>\n      </div>\n    </div>`;\n}\nfunction wireTaskEditor() {\n  const box = $('#tasks');\n  const wire = (r) => {\n    r.querySelector('.rm').onclick = () => r.remove();\n    r.querySelector('.tk').onchange = (e) => {\n      r.querySelector('.tt').placeholder =\n        e.target.value === 'question'\n          ? 'Question, e.g. What did you expect to happen here?'\n          : 'Task, e.g. Find the price of the annual plan';\n    };\n    r.querySelector('.tw').onchange = (e) => {\n      const v = r.querySelector('.tv');\n      v.disabled = e.target.value === 'start';\n      v.placeholder = WHEN_PLACEHOLDER[e.target.value];\n      if (e.target.value === 'start') v.value = '';\n    };\n  };\n  box.querySelectorAll('.taskcard').forEach(wire);\n  $('#taskAdd').onclick = () => {\n    box.insertAdjacentHTML('beforeend', taskRow());\n    wire(box.lastElementChild);\n    box.lastElementChild.querySelector('.tt').focus();\n  };\n}\nfunction taskValue() {\n  return [...$('#tasks').querySelectorAll('.taskcard')]\n    .map((r) => {\n      const type = r.querySelector('.tw').value;\n      let value = r.querySelector('.tv').value.trim();\n      if (type === 'after') value = Math.max(0, (+value || 1) - 1); // people count from 1; the server from 0\n      return {\n        text: r.querySelector('.tt').value,\n        description: r.querySelector('.td').value,\n        kind: r.querySelector('.tk').value,\n        when: { type, value },\n      };\n    })\n    .filter((t) => t.text.trim());\n}\n\n// ---- purpose: view only / unmoderated / moderated ----\nconst MODE_LABEL = { view: 'View only', unmoderated: 'Unmoderated', moderated: 'Moderated' };\nconst MODE_HINT = {\n  view: 'Just for looking: a stakeholder review or a handoff. No tasks, no recording, no consent screen, no feedback button. Who opened it, and when, is still logged.',\n  unmoderated:\n    'A usability test testers do alone, whenever suits them. Tasks, consent and recording carry the session.',\n  moderated:\n    'A usability test where you are on a call with the tester. Results refresh live, you can add moderator notes, and tasks are hidden from the tester by default so you ask them yourself.',\n};\nfunction modeSeg(mode) {\n  mode = MODE_LABEL[mode] ? mode : 'unmoderated';\n  const buttons = Object.entries(MODE_LABEL)\n    .map(([k, v]) => `<button type=\"button\" data-m=\"${k}\" class=\"${mode === k ? 'on' : ''}\">${v}</button>`)\n    .join('');\n  return `\n    <div class=\"field\">\n      <label>What is this share for?</label>\n      <div class=\"seg\" id=\"modeSeg\">${buttons}</div>\n      <div class=\"hint\" id=\"modeHint\"></div>\n    </div>`;\n}\nfunction wireModeSeg() {\n  const set = () => {\n    const m = $('#modeSeg .on').dataset.m;\n    $('#modeHint').textContent = MODE_HINT[m];\n    if ($('#testSetup')) $('#testSetup').hidden = m === 'view';\n  };\n  $('#modeSeg')\n    .querySelectorAll('button')\n    .forEach((b) => {\n      b.onclick = () => {\n        $('#modeSeg')\n          .querySelectorAll('button')\n          .forEach((x) => x.classList.remove('on'));\n        b.classList.add('on');\n        set();\n        // Tasks are shown in an unmoderated test and hidden in a moderated one (the moderator asks them); the switch\n        // below can still be changed afterwards.\n        if ($('#showTasks')) {\n          $('#showTasks').checked = b.dataset.m === 'unmoderated';\n          $('#showTasks').dispatchEvent(new Event('change'));\n        }\n      };\n    });\n  set();\n}\nconst modeValue = () => $('#modeSeg .on').dataset.m;\n\n// ---- option switches: three that change what a tester experiences stay in view; the rest sit under \"More\n// settings\", grouped, each with a short title and one line of what it does ----\nconst OPTIONS = [\n  {\n    id: 'showTasks',\n    main: true,\n    title: 'Show tasks to testers',\n    desc: 'Off for moderated sessions, where you ask them yourself.',\n    on: (s) => s.showTasks !== false,\n  },\n  {\n    id: 'voice',\n    main: true,\n    title: 'Offer voice recording',\n    desc: 'Think-aloud audio. Testers choose on the consent screen and can stop at any time.',\n    on: (s) => !!s.voice,\n  },\n  {\n    id: 'screen',\n    main: true,\n    title: 'Offer screen recording',\n    desc: 'A video of the prototype tab, desktop browsers only. About 5 MB a minute.',\n    on: (s) => !!s.screen,\n  },\n  {\n    id: 'record',\n    group: 'Recording',\n    title: 'Record interactions',\n    desc: 'Clicks, navigation, focus and scroll.',\n    on: (s) => s.recordSessions !== false,\n  },\n  {\n    id: 'recordText',\n    group: 'Recording',\n    title: 'Record what testers type',\n    desc: 'Off by default so real personal data is never captured. Turn on when the prototype uses sample data.',\n    on: (s) => !!s.recordText,\n  },\n  {\n    id: 'consent',\n    group: 'Consent and privacy',\n    title: 'Ask for consent before recording',\n    desc: 'Always on when voice or screen recording is offered; that is where testers choose.',\n    on: (s) => s.requireConsent !== false,\n  },\n  {\n    id: 'wm',\n    group: 'Consent and privacy',\n    title: \"Watermark with the viewer's email\",\n    desc: 'Over every screen, so a screenshot names who took it.',\n    on: (s) => s.watermark !== false,\n  },\n  {\n    id: 'signin',\n    group: 'Access',\n    title: 'Require Google sign-in',\n    desc: 'The link opens only for the invited address, so a forwarded link opens nothing. Needs Google sign-in on this server; excludes people without a Google account.',\n    on: (s) => !!s.requireSignIn,\n  },\n];\nconst sw = (o, on) =>\n  `<label class=\"opt\"><input type=\"checkbox\" id=\"${o.id}\" ${on ? 'checked' : ''}><span class=\"sw\"></span><span><b>${o.title}</b><span class=\"hint\">${o.desc}</span></span></label>`;\nfunction optionChecks(s) {\n  const main = OPTIONS.filter((o) => o.main)\n    .map((o) => sw(o, o.on(s)))\n    .join('');\n  const groups = [...new Set(OPTIONS.filter((o) => o.group).map((o) => o.group))];\n  const more = groups\n    .map(\n      (g) =>\n        `<div class=\"optgroup\"><h4>${g}</h4>${OPTIONS.filter((o) => o.group === g)\n          .map((o) => sw(o, o.on(s)))\n          .join('')}</div>`\n    )\n    .join('');\n  return `<div class=\"stack\" id=\"opts\" style=\"gap:var(--s3)\">${main}</div>\n    <details class=\"more\"><summary>More settings</summary><div class=\"stack\" style=\"gap:var(--s5)\">${more}</div></details>`;\n}\nfunction wireOptions() {} // nothing to wire; kept so the pages that call it do not change\nfunction optionValues() {\n  return {\n    showTasks: $('#showTasks').checked,\n    recordSessions: $('#record').checked,\n    recordText: $('#recordText').checked,\n    voice: $('#voice').checked,\n    screen: $('#screen').checked,\n    requireConsent: $('#consent').checked,\n    requireSignIn: $('#signin').checked,\n    watermark: $('#wm').checked,\n  };\n}\n\n// ---- \"Before you start\": text, or a voice/video intro with captions ----\nfunction introEditor(intro, share) {\n  const kind = intro.kind || 'default';\n  const hasMedia = !!intro.media;\n  const subs = intro.subtitles || [];\n  const kinds = ['default', 'text', 'audio', 'video'];\n  const labels = { default: 'Standard', text: 'Your text', audio: 'Voice recording', video: 'Video' };\n  const kindButtons = kinds\n    .map((k) => `<button type=\"button\" data-k=\"${k}\" class=\"${kind === k ? 'on' : ''}\">${labels[k]}</button>`)\n    .join('');\n  const media = hasMedia\n    ? `<div class=\"row\">${ic('play')}<span>${esc(intro.media.name)} · ${(intro.media.size / 1048576).toFixed(1)} MB · ${esc(intro.media.mime)}</span>\n         ${share ? '<button type=\"button\" class=\"btn small danger\" id=\"introMediaRemove\">Remove</button>' : ''}</div>`\n    : '';\n  const subRows = subs\n    .map(\n      (x) => `<div class=\"row\"><span class=\"pill\">${esc(x.lang)}</span><span>${esc(x.label)}</span>\n                <button type=\"button\" class=\"btn small danger\" data-sub-rm=\"${esc(x.lang)}\">Remove</button></div>`\n    )\n    .join('');\n  const subtitles = !share\n    ? ''\n    : `\n    <div class=\"field\" id=\"subsField\" ${kind === 'video' ? '' : 'hidden'}>\n      <label>Captions and translations (WebVTT files, one per language)</label>\n      ${subs.length ? `<div class=\"stack\" style=\"gap:var(--s1)\">${subRows}</div>` : ''}\n      <div class=\"row\">\n        <input type=\"text\" id=\"subLang\" placeholder=\"Language code, e.g. es\" style=\"width:180px\">\n        <input type=\"text\" id=\"subLabel\" placeholder=\"Label shown to testers, e.g. Español\" style=\"flex:1;width:auto\">\n        <label class=\"btn small\" for=\"subFile\">Upload .vtt<input type=\"file\" id=\"subFile\" accept=\".vtt,text/vtt\" style=\"display:none\"></label>\n      </div>\n      <div class=\"hint\">Ask Claude to transcribe your video and translate the captions into any language; it writes .vtt\n        files you upload here. The tester picks the language in the player; their browser language is chosen\n        automatically when it matches.</div>\n    </div>`;\n  return `\n    <div class=\"section\">\n      <h3>Before you start</h3>\n      <div class=\"hint\">What testers see first. The consent text about recording is always shown below whatever you add here.</div>\n      <div class=\"seg\" id=\"introKind\">${kindButtons}</div>\n      <div class=\"field\" id=\"introTextField\" ${kind === 'default' ? 'hidden' : ''}>\n        <label>Intro text (blank line = new paragraph, lines starting with \"- \" = bullets, **bold**)</label>\n        <textarea id=\"introText\" placeholder=\"Thanks for helping us test the new checkout. There are no right or wrong answers…\">${esc(intro.text || '')}</textarea>\n      </div>\n      <div class=\"field\" id=\"introMediaField\" ${kind === 'audio' || kind === 'video' ? '' : 'hidden'}>\n        <label>Recording</label>\n        ${media}\n        <div class=\"drop\" id=\"introDrop\"><span>${hasMedia ? 'Drop a new file to replace it' : 'Drop an audio or video file here, or click to choose'}</span>\n          <input type=\"file\" id=\"introFile\" accept=\"${me.server.mediaTypes.join(',')}\"></div>\n        <div class=\"hint\">MP4 (H.264) or WebM video, MP3, M4A or WAV audio. Up to ${me.server.maxMediaMb} MB. Streams to\n          testers in pieces, so large files play without a full download. The player has captions, language choice and\n          full screen.</div>\n        <div class=\"progress\" id=\"introProg\" hidden><i></i></div>\n      </div>\n      ${subtitles}\n    </div>`;\n}\nfunction wireIntroEditor(shareId, pendingRef) {\n  $('#introKind')\n    .querySelectorAll('button')\n    .forEach((b) => {\n      b.onclick = () => {\n        $('#introKind')\n          .querySelectorAll('button')\n          .forEach((x) => x.classList.remove('on'));\n        b.classList.add('on');\n        const k = b.dataset.k;\n        $('#introTextField').hidden = k === 'default';\n        $('#introMediaField').hidden = !(k === 'audio' || k === 'video');\n        if ($('#subsField')) $('#subsField').hidden = k !== 'video';\n      };\n    });\n  const d = $('#introDrop');\n  d.onclick = (e) => {\n    if (e.target.tagName !== 'INPUT') $('#introFile').click();\n  };\n  d.ondragover = (e) => {\n    e.preventDefault();\n    d.style.borderColor = 'var(--accent)';\n  };\n  d.ondragleave = () => (d.style.borderColor = '');\n  const take = async (file) => {\n    if (!file) return;\n    if (!me.server.mediaTypes.includes(file.type))\n      return alert('Unsupported file type: ' + (file.type || 'unknown') + '. Use MP4, WebM, MP3, M4A or WAV.');\n    if (file.size > me.server.maxMediaMb * 1048576)\n      return alert('File is larger than the server limit of ' + me.server.maxMediaMb + ' MB');\n    if (shareId) {\n      await uploadIntro(shareId, file);\n      render();\n    } else {\n      pendingRef.media = file;\n      d.firstElementChild.textContent = `${file.name} (${(file.size / 1048576).toFixed(1)} MB), uploads after you create the share`;\n      d.classList.add('has');\n    }\n  };\n  d.ondrop = (e) => {\n    e.preventDefault();\n    d.style.borderColor = '';\n    take(e.dataTransfer.files[0]);\n  };\n  $('#introFile').onchange = (e) => take(e.target.files[0]);\n  if ($('#introMediaRemove'))\n    $('#introMediaRemove').onclick = async () => {\n      if (!confirm('Remove the recording?')) return;\n      await api('/shares/' + shareId + '/intro', { method: 'DELETE' });\n      render();\n    };\n  if ($('#subFile'))\n    $('#subFile').onchange = async (e) => {\n      const f = e.target.files[0];\n      const lang = $('#subLang').value.trim().toLowerCase();\n      if (!f || !lang) return alert('Enter a language code first (for example en, es, de, ja).');\n      try {\n        await uploadXhr('PUT', `/shares/${shareId}/subtitles/${encodeURIComponent(lang)}`, f, {\n          'Content-Type': 'text/vtt',\n          'X-Label': encodeURIComponent($('#subLabel').value.trim() || lang),\n        });\n        toast('Captions uploaded');\n        render();\n      } catch (err) {\n        alert(err.message);\n      }\n    };\n  document.querySelectorAll('[data-sub-rm]').forEach((b) => {\n    b.onclick = async () => {\n      await api(`/shares/${shareId}/subtitles/${encodeURIComponent(b.dataset.subRm)}`, { method: 'DELETE' });\n      render();\n    };\n  });\n}\nfunction introValue() {\n  return { kind: $('#introKind .on').dataset.k, text: $('#introText').value };\n}\nasync function uploadIntro(shareId, file) {\n  const p = $('#introProg');\n  p.hidden = false;\n  try {\n    await uploadXhr(\n      'PUT',\n      '/shares/' + shareId + '/intro',\n      file,\n      { 'Content-Type': file.type, 'X-File-Name': encodeURIComponent(file.name) },\n      (f) => (p.firstElementChild.style.width = Math.round(f * 100) + '%')\n    );\n    toast('Recording uploaded');\n  } catch (e) {\n    alert(e.message);\n  } finally {\n    p.hidden = true;\n  }\n}\n<\/script>\n    <script>'use strict';\n// Sign-in screen and the \"you have left\" screen.\n/* exported renderLogin, renderLeft */\n/* global $, esc, ic, api, render */\n\nasync function renderLogin(app) {\n  let a = {};\n  try {\n    a = await (await fetch('/api/auth')).json();\n  } catch {\n    /* server unreachable: show the token form anyway */\n  }\n  const google = a.google\n    ? `\n      <div class=\"stack\" style=\"gap:var(--s2)\">\n        <a class=\"btn primary\" href=\"/auth/google\" style=\"width:100%\">Sign in with Google</a>\n        <div class=\"hint\">Your prototypes, links and results are visible only to you.</div>\n      </div>\n      ${a.serverToken ? '<div class=\"divider\">or</div>' : ''}`\n    : '';\n  const sso = !a.sso\n    ? ''\n    : a.ssoEmail && !a.ssoAdmin\n      ? `<div class=\"warn\">You are signed in as <b>${esc(a.ssoEmail)}</b> through your company sign-in, but that\n           address is not on this server's admin list. Ask whoever runs the Vantage to add it (ADMIN_EMAILS), then reload.</div>`\n      : `\n      <div class=\"stack\" style=\"gap:var(--s2)\">\n        <button class=\"btn primary\" type=\"button\" id=\"ssoGo\" style=\"width:100%\">Continue with company sign-in</button>\n        <div class=\"hint\">Uses your company identity provider through the proxy in front of this server. No separate password.</div>\n      </div>\n      <div class=\"divider\">or</div>`;\n  const tokenForm = !a.serverToken\n    ? ''\n    : `\n      <form class=\"stack\" id=\"loginForm\" style=\"gap:var(--s2)\">\n        <div class=\"field\">\n          <label>Admin token</label>\n          <div class=\"form\">\n            <input type=\"password\" id=\"tok\" placeholder=\"Paste the token\" autofocus autocomplete=\"current-password\">\n            <button class=\"btn primary\" type=\"submit\">Sign in</button>\n          </div>\n        </div>\n        <div class=\"hint\">Printed in the terminal where the server runs, along with a link that signs you in without\n          pasting. For a server you run yourself, or as a fallback when company sign-in is not configured.</div>\n        <p id=\"err\" style=\"color:var(--danger);margin:0\"></p>\n      </form>`;\n  const intro = a.google\n    ? 'Sign in to share prototypes with named people through private, expiring links.'\n    : 'Vantage is self-hosted by your company. There is nothing to sign up for: access is granted by whoever runs the server.';\n  app.innerHTML = `\n    <div class=\"gate\"><div class=\"card\">\n      <div class=\"lock\">${ic('lock', 'lg')}</div>\n      <h1>Sign in</h1>\n      <p>${intro}</p>\n      <div class=\"stack\" style=\"gap:var(--s4)\">${google}${sso}${tokenForm}</div>\n      <footer>Every sign-in and every failed attempt is recorded in the access log.</footer>\n    </div></div>`;\n  if ($('#ssoGo')) $('#ssoGo').onclick = () => location.reload();\n  if ($('#loginForm'))\n    $('#loginForm').onsubmit = async (e) => {\n      e.preventDefault();\n      token = $('#tok').value.trim();\n      try {\n        me = await api('/me');\n        sessionStorage.setItem('vantage_token', token);\n        render();\n      } catch {\n        token = '';\n        $('#err').textContent = 'That token was not accepted.';\n      }\n    };\n}\n\nfunction renderLeft(app) {\n  const n = left.shares;\n  const t = left.tokens;\n  const after = left.sso\n    ? 'Your company sign-in still exists; it is managed by your company, not by this server. Ask whoever runs the Vantage to remove you from the admin list so this console no longer opens for you.'\n    : 'Nothing else about you is kept here.';\n  app.innerHTML = `\n    <div class=\"gate\"><div class=\"card\">\n      <div class=\"lock\">${ic('lock', 'lg')}</div>\n      <h1>You have left</h1>\n      <p>${n} prototype${n === 1 ? '' : 's'} you shared ${n === 1 ? 'was' : 'were'} deleted with all their files, links,\n        recordings and results, and ${t} connected tool${t === 1 ? ' was' : 's were'} disconnected.</p>\n      <p>${after}</p>\n      <footer>Access-log entries mentioning you stay for the retention period, because they are security records.</footer>\n    </div></div>`;\n}\n<\/script>\n    <script>'use strict';\n// The Prototypes list (with the \"try it\" empty state) and the Server page.\n/* exported renderList, renderServer */\n/* global $, esc, ic, fmt, rel, count, toast, api, shell, wireShell, render */\n\nfunction shareRow(s) {\n  const kind = s.mode === 'moderated' ? 'Moderated test · ' : s.mode === 'view' ? 'View only · ' : '';\n  const extras = (s.hasPasscode ? ' · passcode' : '') + (s.files ? '' : ' · <b>no files</b>');\n  return `\n    <div class=\"item\" data-id=\"${s.id}\">\n      <div>\n        <div class=\"n\">${esc(s.name)}</div>\n        <div class=\"m\">${kind}Created ${fmt(s.createdAt)} · expires ${rel(s.expiresAt)}${extras}</div>\n      </div>\n      ${count(s.viewerCount, 'people', 'viewer')}\n      ${count(s.totalOpens, 'eye', 'open')}\n      <span class=\"pillcell\"><span class=\"pill ${s.status}\">${s.status}</span></span>\n    </div>`;\n}\n\nasync function renderList(app) {\n  app.innerHTML = shell(\n    `<div class=\"pagehead\"><h1>Prototypes</h1><span class=\"spacer\"></span>\n       <button class=\"btn primary reveal\" id=\"new\">${ic('plus')}<span>New Share</span></button></div>\n     <div class=\"card shares\" id=\"list\"><p class=\"muted\" style=\"margin:0\">Loading…</p></div>`,\n    'list'\n  );\n  wireShell();\n  $('#new').onclick = () => {\n    view = { page: 'new' };\n    render();\n  };\n  const { shares } = await api('/shares');\n  const l = $('#list');\n  if (!shares.length) {\n    l.innerHTML = `\n      <div class=\"stack\" style=\"gap:var(--s4)\">\n        <p class=\"muted\" style=\"margin:0\">Nothing shared yet. The quickest way to see how it works is to share the\n          sample prototype with yourself and open your own link: you get the consent screen, the tasks, the feedback\n          button and the watermark exactly as a tester would.</p>\n        <div class=\"row\">\n          <input type=\"email\" id=\"sampleEmail\" placeholder=\"Your email (for your personal link)\" style=\"flex:1;width:auto;max-width:360px\">\n          <button class=\"btn primary\" id=\"sample\">Try it with the sample prototype</button>\n        </div>\n        <p class=\"muted\" style=\"margin:0\">Or click <b>New Share</b> and drop your own prototype folder, or ask Claude to share one.</p>\n      </div>`;\n    $('#sample').onclick = async () => {\n      const viewer = $('#sampleEmail').value.trim();\n      if (!viewer) return $('#sampleEmail').focus();\n      const b = $('#sample');\n      b.disabled = true;\n      try {\n        const { share } = await api('/shares/sample', { method: 'POST', body: JSON.stringify({ viewer }) });\n        toast('Shared with you. Open your personal link below to see what a tester sees.', 6000);\n        view = {\n          page: 'share',\n          id: share.id,\n          tab: 'links',\n          links: Object.fromEntries(share.viewers.map((v) => [v.id, v.link])),\n        };\n        render();\n      } catch (e) {\n        b.disabled = false;\n        alert(e.message);\n      }\n    };\n    $('#sampleEmail').onkeydown = (e) => {\n      if (e.key === 'Enter') $('#sample').click();\n    };\n    return;\n  }\n  l.innerHTML =\n    `<div class=\"head\"><span>Prototype</span><span class=\"r\" title=\"People invited to open it\">Viewers</span>\n       <span class=\"r\" title=\"Times a link was opened\">Opens</span><span class=\"r\">Status</span></div>` +\n    shares.map(shareRow).join('');\n  l.querySelectorAll('.item').forEach((el) => {\n    el.onclick = () => {\n      view = { page: 'share', id: el.dataset.id, tab: 'links' };\n      render();\n    };\n  });\n}\n\nasync function renderServer(app) {\n  // Tester traffic this month against the free allowance. When it is used up, links pause until the 1st and say so.\n  const allowance = (u) => {\n    if (!u || (!u.maxBytes && !u.maxRequests)) return 'No limit set';\n    const mb = (b) => (b / 1048576).toFixed(0);\n    const used = `${mb(u.bytes)} of ${mb(u.maxBytes)} MB and ${u.requests.toLocaleString()} of ${u.maxRequests.toLocaleString()} requests used this month`;\n    return u.paused\n      ? `<span style=\"color:var(--danger)\">Used up. Links are paused until the 1st and tell testers so.</span> ${used}${u.refused ? `; ${u.refused} opens refused` : ''}`\n      : `${used}. When it is used up, links pause until the 1st and tell testers so, so this copy never costs money.`;\n  };\n  const m = await api('/me');\n  const s = m.server;\n  const row = (k, v) => `<dt>${k}</dt><dd>${v}</dd>`;\n  const encryption = s.encryptionAtRest\n    ? 'On'\n    : '<span style=\"color:var(--warn)\">Off. Set VANTAGE_ENCRYPTION_KEY.</span>';\n  const secrets = s.quickstart\n    ? row(\n        'Secrets',\n        'Made by the server on first start and kept in the data directory. Fine for trying it out; for a real deployment set <span class=\"mono\">ADMIN_TOKEN</span> and <span class=\"mono\">VANTAGE_ENCRYPTION_KEY</span> yourself.'\n      )\n    : '';\n  const origins = s.allowedExternalOrigins.length\n    ? esc(s.allowedExternalOrigins.join(', '))\n    : 'None allowed. Prototypes must be self-contained.';\n  app.innerHTML = shell(\n    `<div class=\"pagehead\"><h1>Server</h1></div>\n     <p class=\"hint\" style=\"margin:0 0 var(--s5);max-width:60ch\">Set by whoever runs this server, before it starts. Nothing here can be changed from a browser, on purpose: a stolen session must never be able to open the door for everyone.</p>\n     <div class=\"stack\" style=\"gap:var(--s7)\">\n       <div class=\"card\"><div class=\"section\"><h3>Status</h3><dl class=\"kv\">\n         ${row('Version', esc(s.version))}\n         ${row('Console address', esc(s.publicUrl))}\n         ${row('Prototypes served from', `${esc(s.contentOrigin)} <span class=\"hint\">(a separate origin, so a prototype's scripts cannot reach this console)</span>`)}\n         ${row('Encryption at rest', encryption)}\n         ${row('Viewer sign-in', s.sso ? 'SSO header + personal links' : 'Personal links')}\n         ${row('Signed in as', `${esc(m.identity.who)} · ${esc(m.identity.label)}`)}\n         ${secrets}\n       </dl></div></div>\n       <div class=\"card\"><div class=\"section\"><h3>Policy</h3><dl class=\"kv\">\n         ${row('Default expiry', `${s.defaultExpiryDays} days`)}\n         ${row('Maximum expiry', `${s.maxExpiryDays} days (MAX_EXPIRY_DAYS)`)}\n         ${row('Retention after expiry', `${s.retentionDays} days, then the share is deleted`)}\n         ${row('Viewer session', `${s.sessionHours} hours`)}\n         ${row('Prototype upload limit', `${s.maxUploadMb} MB`)}\n         ${row('Media limit (intro + voice)', `${s.maxMediaMb} MB per share`)}\n         ${row('External origins', origins)}\n         ${row('Free monthly allowance', allowance(s.usage))}\n       </dl>\n       <div class=\"hint\">Change these with environment variables and restart. See <a href=\"/docs/deployment\" target=\"_blank\">Deployment</a>.</div>\n       </div></div>\n     </div>`,\n    'server'\n  );\n  wireShell();\n}\n<\/script>\n    <script>'use strict';\n// The New share page: files, people, expiry, purpose, test setup, intro, notes.\n/* exported renderNew */\n/* global $, esc, b64, filesFromDrop, toast, api, shell, wireShell, render, modeSeg, wireModeSeg, modeValue,\n   taskEditor, wireTaskEditor, taskValue, optionChecks, wireOptions, optionValues, introEditor, wireIntroEditor,\n   introValue, uploadIntro */\n\nlet pending = { files: [], entry: '', media: null };\n\nfunction renderNew(app) {\n  pending = { files: [], entry: '', media: null };\n  app.innerHTML = shell(\n    `<div class=\"pagehead\"><h1>New Share</h1></div>\n     <div class=\"card\" style=\"max-width:var(--form-w)\">\n       <form class=\"stack\" id=\"newForm\" style=\"gap:var(--s7)\">\n         <div class=\"section\">\n           <h3>Prototype</h3>\n           <div class=\"hint\">Upload the files, say who may open it, and set when it stops working.</div>\n           <div class=\"field\"><label>Name</label>\n             <input type=\"text\" id=\"name\" placeholder=\"e.g. Checkout redesign v3, usability round 2\"></div>\n           <div class=\"field\"><label>Prototype files</label>\n             <div class=\"drop\" id=\"drop\"><span>Drop a folder or an .html file here, or click to choose</span>\n               <input type=\"file\" id=\"fileIn\" multiple webkitdirectory>\n               <input type=\"file\" id=\"fileIn2\" multiple accept=\".html,.htm,.css,.js,.png,.jpg,.svg,.json,.woff,.woff2\"></div>\n             <div class=\"hint\">Everything in the folder is uploaded. Files must be self-contained: scripts, styles and\n               fonts loaded from the internet are blocked. Run <span class=\"mono\">vantage inline</span> first if needed.\n               Shift-click the box to pick single files.</div></div>\n           <div class=\"field\" id=\"entryRow\" hidden><label>Open this file first</label><select id=\"entry\"></select></div>\n         </div>\n         <div class=\"section\">\n           <h3>Who can open it</h3>\n           <div class=\"field\">\n             <label>People (one per line: <span class=\"mono\">Name &lt;email&gt;</span> or just an email)</label>\n             <textarea id=\"viewers\" placeholder=\"Priya Shah <priya@customer.example>&#10;tom@partner.example\"></textarea>\n             <div class=\"hint\">Each person gets their own private link, shown once after you create the share. Send links\n               through your usual channel.</div></div>\n           <div class=\"cols2\">\n             <div class=\"field\"><label>Expires in (days)</label>\n               <input type=\"number\" id=\"days\" value=\"${me.server.defaultExpiryDays}\" min=\"1\" max=\"${me.server.maxExpiryDays}\">\n               <div class=\"hint\">Up to ${me.server.maxExpiryDays} days. You can extend any time.</div></div>\n             <div class=\"field\"><label>Passcode (optional second factor, 6+ characters)</label>\n               <input type=\"text\" id=\"passcode\" placeholder=\"Share it by phone or a separate message\" autocomplete=\"off\"></div>\n           </div>\n         </div>\n         <div class=\"section\"><h3>Purpose</h3>${modeSeg('view')}</div>\n         <div class=\"section\" id=\"testSetup\"><h3>Test setup</h3>${taskEditor([])}${optionChecks({})}</div>\n         ${introEditor({ kind: 'default', text: '', media: null }, null)}\n         <div class=\"field\"><label>Notes (internal, shown only here)</label><textarea id=\"notes\" style=\"min-height:64px\"></textarea></div>\n         <div class=\"row end\">\n           <span class=\"hint\" id=\"status\"></span>\n           <button class=\"btn\" type=\"button\" id=\"cancel\">Cancel</button>\n           <button class=\"btn primary\" type=\"submit\" id=\"create\">Create share</button>\n         </div>\n       </form>\n     </div>`,\n    'new'\n  );\n  wireShell();\n  $('#cancel').onclick = () => {\n    view = { page: 'list' };\n    render();\n  };\n  wireModeSeg();\n  wireTaskEditor();\n  wireOptions();\n  wireIntroEditor(null, pending);\n  const drop = $('#drop');\n  drop.onclick = (e) => {\n    if (e.target.tagName === 'INPUT') return;\n    (e.shiftKey ? $('#fileIn2') : $('#fileIn')).click();\n  };\n  drop.ondragover = (e) => {\n    e.preventDefault();\n    drop.style.borderColor = 'var(--accent)';\n  };\n  drop.ondragleave = () => (drop.style.borderColor = '');\n  drop.ondrop = async (e) => {\n    e.preventDefault();\n    drop.style.borderColor = '';\n    await loadFiles(await filesFromDrop(e));\n  };\n  $('#fileIn').onchange = (e) =>\n    loadFiles([...e.target.files].map((f) => ({ path: f.webkitRelativePath || f.name, file: f })));\n  $('#fileIn2').onchange = (e) => loadFiles([...e.target.files].map((f) => ({ path: f.name, file: f })));\n  $('#newForm').onsubmit = (e) => {\n    e.preventDefault();\n    create();\n  };\n}\n\nconst JUNK = /(^|\\/)(node_modules|\\.git|__MACOSX)\\//;\nasync function loadFiles(list) {\n  pending.files = [];\n  let bytes = 0;\n  for (const { path, file } of list) {\n    if (JUNK.test(path) || /\\.DS_Store$/.test(path)) continue;\n    const buf = new Uint8Array(await file.arrayBuffer());\n    bytes += buf.length;\n    pending.files.push({ path, contentBase64: b64(buf) });\n  }\n  $('#drop span').textContent = `${pending.files.length} files (${Math.round(bytes / 1024)} KB)`;\n  $('#drop').classList.add('has');\n  const htmls = pending.files.filter((f) => /\\.html?$/i.test(f.path)).map((f) => f.path);\n  const sel = $('#entry');\n  sel.innerHTML = htmls.map((h) => `<option>${esc(h)}</option>`).join('');\n  const idx = htmls.find((h) => /(^|\\/)index\\.html$/.test(h));\n  if (idx) sel.value = idx;\n  $('#entryRow').hidden = htmls.length < 2;\n}\n\nasync function create() {\n  const b = $('#create');\n  b.disabled = true;\n  $('#status').textContent = 'Uploading…';\n  try {\n    const body = {\n      name: $('#name').value,\n      expiresInDays: +$('#days').value,\n      passcode: $('#passcode').value || undefined,\n      viewers: $('#viewers')\n        .value.split('\\n')\n        .map((s) => s.trim())\n        .filter(Boolean),\n      tasks: taskValue(),\n      notes: $('#notes').value,\n      mode: modeValue(),\n      intro: introValue(),\n      ...optionValues(),\n    };\n    if (pending.files.length) {\n      body.files = pending.files;\n      body.entry = $('#entryRow').hidden ? undefined : $('#entry').value;\n    }\n    const { share } = await api('/shares', { method: 'POST', body: JSON.stringify(body) });\n    if (pending.media) {\n      $('#status').textContent = 'Uploading recording…';\n      await uploadIntro(share.id, pending.media);\n    }\n    toast('Share created');\n    view = {\n      page: 'share',\n      id: share.id,\n      tab: 'links',\n      links: Object.fromEntries(share.viewers.map((v) => [v.id, v.link])),\n    };\n    render();\n  } catch (e) {\n    $('#status').textContent = '';\n    b.disabled = false;\n    alert(e.message);\n  }\n}\n<\/script>\n    <script>'use strict';\n// One share: header with revoke/extend, then the tabs Viewers & links, Access log, Feedback & results, Settings & files.\n/* exported renderShare */\n/* global $, esc, fmt, rel, ic, toast, api, copy, download, blobUrl, b64, filesFromDrop, shell, wireShell,\n   render, stopLive, modeSeg, wireModeSeg, modeValue, taskEditor, wireTaskEditor, taskValue, optionChecks,\n   wireOptions, optionValues, introEditor, wireIntroEditor, introValue */\n\nasync function renderShare(app) {\n  app.innerHTML = shell('<div id=\"detail\"><p class=\"muted\">Loading…</p></div>', 'list');\n  wireShell();\n  let share;\n  try {\n    ({ share } = await api('/shares/' + view.id));\n  } catch (e) {\n    $('#detail').innerHTML = '<p>' + esc(e.message) + '</p>';\n    return;\n  }\n  const tabs = {\n    links: 'Viewers & links',\n    activity: 'Access log',\n    results: 'Feedback & results',\n    settings: 'Settings & files',\n  };\n  if (share.mode === 'view') delete tabs.results;\n  if (!tabs[view.tab]) view.tab = 'links';\n  const modePill =\n    share.mode === 'moderated'\n      ? '<span class=\"pill\">moderated</span>'\n      : share.mode === 'view'\n        ? '<span class=\"pill\">view only</span>'\n        : '';\n  const files = share.files\n    ? `${share.files.count} files, ${Math.round(share.files.bytes / 1024)} KB`\n    : '<b>no files uploaded</b>';\n  const access =\n    share.status === 'active'\n      ? '<button class=\"btn danger\" id=\"revoke\">Revoke access</button>'\n      : share.revoked\n        ? '<button class=\"btn\" id=\"unrevoke\">Restore access</button>'\n        : '';\n  $('#detail').innerHTML = `\n    <div class=\"pagehead\"><a href=\"#\" data-nav=\"list\" class=\"btn small\">← All prototypes</a></div>\n    <div class=\"card\">\n      <div class=\"head-row\">\n        <div>\n          <h2>${esc(share.name)} <span class=\"pill ${share.status}\">${share.status}</span>${modePill}</h2>\n          <div class=\"hint\">Created ${fmt(share.createdAt)} · expires ${fmt(share.expiresAt)} (${rel(share.expiresAt)})${share.hasPasscode ? ' · passcode required' : ''} · ${files}</div>\n        </div>\n        <div class=\"row\">${access}<button class=\"btn\" id=\"extendBtn\">Extend…</button></div>\n      </div>\n      <div class=\"row\" id=\"extendRow\" hidden style=\"margin-top:var(--s3)\">\n        <span class=\"hint\">Extend by</span>\n        <input type=\"number\" id=\"extDays\" value=\"30\" min=\"1\" max=\"${me.server.maxExpiryDays}\" style=\"width:96px\">\n        <span class=\"hint\">days</span><button class=\"btn small primary\" id=\"extGo\">Extend</button>\n        <span class=\"hint\">or set a date</span><input type=\"date\" id=\"extDate\"><button class=\"btn small\" id=\"extSet\">Set</button>\n        <span class=\"hint\">Server maximum ${me.server.maxExpiryDays} days from today.</span>\n      </div>\n      ${share.files ? '' : '<div class=\"warn\" style=\"margin-top:var(--s4)\">No prototype files yet. Upload a folder under Settings & files, or run <span class=\"mono\">vantage publish</span>.</div>'}\n      <div class=\"tabs\">${Object.entries(tabs)\n        .map(([k, v]) => `<button data-t=\"${k}\" class=\"${view.tab === k ? 'on' : ''}\">${v}</button>`)\n        .join('')}</div>\n      <div id=\"tab\"></div>\n    </div>`;\n  $('#detail')\n    .querySelectorAll('[data-nav]')\n    .forEach((a) => {\n      a.onclick = (e) => {\n        e.preventDefault();\n        view = { page: 'list' };\n        render();\n      };\n    });\n  $('#detail')\n    .querySelectorAll('.tabs button')\n    .forEach((b) => {\n      b.onclick = () => {\n        view.tab = b.dataset.t;\n        render();\n      };\n    });\n  const patch = (body) => api('/shares/' + share.id, { method: 'PATCH', body: JSON.stringify(body) });\n  if ($('#revoke'))\n    $('#revoke').onclick = async () => {\n      if (!confirm('Revoke access for everyone? Links stop working immediately.')) return;\n      await patch({ revoked: true });\n      toast('Revoked');\n      render();\n    };\n  if ($('#unrevoke'))\n    $('#unrevoke').onclick = async () => {\n      await patch({ revoked: false });\n      render();\n    };\n  $('#extendBtn').onclick = () => ($('#extendRow').hidden = !$('#extendRow').hidden);\n  $('#extGo').onclick = async () => {\n    try {\n      await patch({ extendDays: +$('#extDays').value || 0 });\n      toast('Extended');\n      render();\n    } catch (e) {\n      alert(e.message);\n    }\n  };\n  $('#extSet').onclick = async () => {\n    const v = $('#extDate').value;\n    if (!v) return;\n    try {\n      await patch({ expiresAt: new Date(v + 'T23:59:59').toISOString() });\n      toast('Expiry set');\n      render();\n    } catch (e) {\n      alert(e.message);\n    }\n  };\n  const t = $('#tab');\n  const tab = { links: tabLinks, activity: tabActivity, results: tabResults, settings: tabSettings }[view.tab];\n  return tab(t, share);\n}\n\n// ---- Viewers & links. A link is shown once, when issued; the console keeps it in view.links until you leave the page.\nfunction tabLinks(t, share) {\n  const links = view.links || (view.links = {});\n  const link = (v) => (v.revoked ? '' : links[v.id] || '');\n  const row = (v) => {\n    const l = link(v);\n    const linkCell = l\n      ? `<div class=\"link\">${esc(l)}</div>`\n      : v.revoked\n        ? '—'\n        : '<span class=\"muted\">Issued earlier. Make a new link to send it again.</span>';\n    const copyButtons = l\n      ? `<button class=\"btn small\" data-copy=\"${esc(l)}\">Copy</button>\n         <button class=\"btn small\" data-copy=\"vantage://open?u=${encodeURIComponent(l)}\"\n           title=\"Same link, for the Vantage viewer app: it blacks out screenshots and screen sharing on macOS and Windows\">App link</button>`\n      : '';\n    const manage = v.revoked\n      ? ''\n      : `<button class=\"btn small\" data-rotate=\"${v.id}\" title=\"Makes a new link for this person. The old one stops working.\">New link</button>\n         <button class=\"btn small danger\" data-revoke=\"${v.id}\">Revoke</button>`;\n    return `\n      <tr class=\"${v.revoked ? 'muted' : ''}\">\n        <td><b>${esc(v.name)}</b><br><span class=\"muted\">${esc(v.email)}</span>${v.source === 'sso' ? ' <span class=\"pill\">sso</span>' : ''}${v.revoked ? ' <span class=\"pill revoked\">revoked</span>' : ''}</td>\n        <td class=\"num\">${v.opens}${v.maxOpens ? ' / ' + v.maxOpens : ''}</td>\n        <td>${fmt(v.lastSeenAt)}</td>\n        <td>${linkCell}</td>\n        <td class=\"actions\"><span class=\"row\" style=\"flex-wrap:nowrap\">${copyButtons}${manage}</span></td>\n      </tr>`;\n  };\n  t.innerHTML = `\n    <div class=\"stack\">\n      <div class=\"hint\">Send each person their own link through your normal channel. A link is shown once, when it is\n        issued, and is not stored: copy it now, or click <b>New link</b> to make another (the old one stops working).\n        <b>App link</b> opens the same prototype in the Vantage viewer app (see the README), whose window is\n        excluded from screenshots and screen sharing on macOS and Windows.</div>\n      <table>\n        <thead><tr><th>Viewer</th><th class=\"num\">Opens</th><th style=\"width:160px\">Last seen</th><th>Personal link</th><th class=\"actions\"></th></tr></thead>\n        <tbody>${share.viewers.map(row).join('')}</tbody>\n      </table>\n      <div class=\"row\" id=\"addRow\">\n        <input type=\"text\" id=\"nvName\" placeholder=\"Name\" autocomplete=\"off\" style=\"flex:1;width:auto;min-width:140px\">\n        <input type=\"email\" id=\"nvEmail\" placeholder=\"Email\" autocomplete=\"off\" style=\"flex:2;width:auto;min-width:200px\">\n        <button class=\"btn\" id=\"add\" disabled>Add viewer</button>\n        ${share.viewers.filter(link).length > 1 ? '<button class=\"btn\" id=\"copyAll\">Copy all links</button>' : ''}\n      </div>\n    </div>`;\n  t.querySelectorAll('[data-copy]').forEach((b) => (b.onclick = () => copy(b.dataset.copy)));\n  t.querySelectorAll('[data-rotate]').forEach((b) => {\n    b.onclick = async () => {\n      if (!confirm('Make a new link for this person? The current one stops working.')) return;\n      const r = await api(`/shares/${share.id}/viewers/${b.dataset.rotate}/rotate`, { method: 'POST' });\n      links[r.viewer.id] = r.viewer.link;\n      render();\n    };\n  });\n  t.querySelectorAll('[data-revoke]').forEach((b) => {\n    b.onclick = async () => {\n      if (!confirm('Revoke this viewer?')) return;\n      await api(`/shares/${share.id}/viewers/${b.dataset.revoke}`, { method: 'DELETE' });\n      render();\n    };\n  });\n  // Add viewer needs both a name and a plausible email before the button wakes up.\n  const nvOk = () => $('#nvName').value.trim() && /^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$/.test($('#nvEmail').value.trim());\n  const nvSync = () => ($('#add').disabled = !nvOk());\n  $('#nvName').oninput = nvSync;\n  $('#nvEmail').oninput = nvSync;\n  $('#add').onclick = async () => {\n    if (!nvOk()) return;\n    const s = `${$('#nvName').value.trim()} <${$('#nvEmail').value.trim()}>`;\n    try {\n      const r = await api(`/shares/${share.id}/viewers`, { method: 'POST', body: JSON.stringify({ viewers: [s] }) });\n      for (const v of r.viewers) if (v.link) links[v.id] = v.link;\n      render();\n    } catch (e) {\n      alert(e.message);\n    }\n  };\n  for (const id of ['#nvName', '#nvEmail'])\n    $(id).onkeydown = (e) => {\n      if (e.key === 'Enter') {\n        e.preventDefault();\n        $('#add').click();\n      }\n    };\n  if ($('#copyAll'))\n    $('#copyAll').onclick = () =>\n      copy(\n        share.viewers\n          .filter(link)\n          .map((v) => `${v.name} <${v.email}>: ${link(v)}`)\n          .join('\\n')\n      );\n}\n\n// ---- Access log\nasync function tabActivity(t, share) {\n  const { audit } = await api('/shares/' + share.id + '/audit');\n  const row = (a) => `\n    <li><span class=\"ts\">${esc(a.ts.replace('T', ' ').slice(0, 19))}</span><b>${esc(a.type)}</b>\n      ${a.email ? esc(a.email) : ''} ${a.reason ? '(' + esc(a.reason) + ')' : ''}\n      <span class=\"muted\">${esc(a.ip || '')}${a.by ? ' by ' + esc(a.by) : ''}</span></li>`;\n  t.innerHTML = audit.length\n    ? `<ul class=\"timeline\">${audit.slice().reverse().map(row).join('')}</ul>`\n    : '<p class=\"muted\">No activity yet.</p>';\n}\n\n// ---- Feedback & results\nconst whenLabel = (w) =>\n  w.type === 'start'\n    ? 'At start'\n    : w.type === 'after'\n      ? 'After task ' + (w.value + 1)\n      : w.type === 'screen'\n        ? 'On ' + esc(w.value)\n        : 'After ' + w.value + ' min';\nfunction feedbackRow(f) {\n  const who = esc(f.kind === 'note' ? 'Moderator' : f.viewer);\n  let what = '';\n  if (f.kind === 'task')\n    what =\n      f.result === 'answer'\n        ? `<span class=\"pill\">answer</span> question ${f.taskIndex + 1}`\n        : `<span class=\"pill ${f.result === 'done' ? 'active' : 'revoked'}\">${f.result === 'done' ? 'completed' : 'stuck'}</span> task ${f.taskIndex + 1}`;\n  const about = f.kind === 'note' && f.viewer ? ` about ${esc(f.viewer)}` : '';\n  const where = f.location\n    ? ` <span class=\"loc\" title=\"Where they were in the prototype\">${ic('screen')}on <span class=\"mono\">${esc(f.location)}</span></span>`\n    : '';\n  const text = f.text ? `<div style=\"margin-top:var(--s1);white-space:pre-wrap\">${esc(f.text)}</div>` : '';\n  return `<li><span class=\"ts\">${esc(f.ts.replace('T', ' ').slice(0, 16))}</span><b>${who}</b> ${what}${about}${where}${text}</li>`;\n}\nasync function tabResults(t, share) {\n  const draw = async () => {\n    const [{ feedback }, sum, fresh] = await Promise.all([\n      api('/shares/' + share.id + '/feedback'),\n      api('/shares/' + share.id + '/summary'),\n      api('/shares/' + share.id),\n    ]);\n    const live = !!liveTimer;\n    const recs = fresh.share.recordings || [];\n    const stat = (n, label) => `<div class=\"stat\"><b>${n}</b><span>${label}</span></div>`;\n    const taskRows = sum.tasks\n      .map(\n        (x) => `\n        <tr><td>${x.kind === 'question' ? 'Question' : 'Task'}</td><td>${x.index + 1}. ${esc(x.task)}</td>\n          <td class=\"muted\">${whenLabel(x.when)}</td>\n          <td class=\"num\" style=\"color:var(--ok)\">${x.kind === 'task' ? x.done : '—'}</td>\n          <td class=\"num\" style=\"color:var(--danger)\">${x.kind === 'task' ? x.stuck : '—'}</td>\n          <td class=\"num\">${x.kind === 'question' ? x.answers : '—'}</td></tr>`\n      )\n      .join('');\n    const testerRows = sum.viewers\n      .map((v) => {\n        const top = Object.entries(v.paths)\n          .sort((a, b) => b[1] - a[1])\n          .slice(0, 3)\n          .map((p) => `${p[0]} (${p[1]})`)\n          .join(', ');\n        return `\n        <tr><td>${esc(v.viewer)}<br><span class=\"muted\">${esc(v.email)}</span></td>\n          <td class=\"num\">${v.sessions}</td><td class=\"num\">${v.clicks}</td><td class=\"num\">${v.pageviews}</td><td class=\"num\">${v.errors}</td>\n          <td>${fmt(v.first)}</td><td>${fmt(v.last)}</td><td class=\"mono\">${esc(top)}</td></tr>`;\n      })\n      .join('');\n    const recRows = recs\n      .map(\n        (r) => `\n        <tr><td>${esc(r.viewer || '')}<br><span class=\"muted\">${esc(r.email || '')}</span></td>\n          <td>${fmt(r.startedAt)}</td><td class=\"num\">${(r.size / 1048576).toFixed(1)} MB</td>\n          <td><${r.mime.startsWith('video/') ? 'video' : 'audio'} controls preload=\"none\" data-rec=\"${r.session}\" data-mime=\"${esc(r.mime)}\" style=\"width:100%;max-width:360px\"></${r.mime.startsWith('video/') ? 'video' : 'audio'}></td>\n          <td class=\"actions\"><span class=\"row\" style=\"flex-wrap:nowrap\">\n            <button class=\"btn small\" data-recdl=\"${r.session}\">${ic('download')}</button>\n            <button class=\"btn small danger\" data-recrm=\"${r.session}\">Delete</button></span></td></tr>`\n      )\n      .join('');\n    // A refresh must not throw away a note being typed, stop a recording being played, or paint another share's page.\n    if (view.id !== share.id || view.tab !== 'results') return;\n    if (($('#noteText') && $('#noteText').value) || [...t.querySelectorAll('audio,video')].some((m) => !m.paused))\n      return;\n    const noteWho = ['<option value=\"\">General</option>']\n      .concat(share.viewers.map((v) => `<option value=\"${v.id}\">${esc(v.name)}</option>`))\n      .join('');\n    t.innerHTML = `\n      <div class=\"stack\" style=\"gap:var(--s6)\">\n        <div class=\"head-row\">\n          <div class=\"stats\">\n            ${stat(sum.viewers.length, 'testers with sessions')}${stat(sum.eventCount, 'interactions')}\n            ${stat(sum.feedbackCount, 'feedback notes')}${stat(recs.length, 'recordings')}${stat(sum.noteCount, 'moderator notes')}\n          </div>\n          <div class=\"row\">\n            <button class=\"btn small ${live ? 'primary' : ''}\" id=\"live\" title=\"Refresh every 5 seconds while a session runs\">${live ? 'Live · on' : 'Live'}</button>\n            <button class=\"btn small\" id=\"expMd\">${ic('download')}Report (.md)</button>\n            <button class=\"btn small\" id=\"expCsv\">${ic('download')}Events (.csv)</button>\n            <button class=\"btn small\" id=\"expJson\">${ic('download')}Everything (.json)</button>\n          </div>\n        </div>\n        ${sum.tasks.length ? `<div class=\"section\"><h3>Tasks and questions</h3><table><thead><tr><th style=\"width:90px\">Type</th><th>Text</th><th style=\"width:170px\">When</th><th class=\"num\">Completed</th><th class=\"num\">Stuck</th><th class=\"num\">Answers</th></tr></thead><tbody>${taskRows}</tbody></table></div>` : ''}\n        ${sum.viewers.length ? `<div class=\"section\"><h3>Per tester</h3><table><thead><tr><th>Tester</th><th class=\"num\">Sessions</th><th class=\"num\">Clicks</th><th class=\"num\">Screens</th><th class=\"num\">Errors</th><th style=\"width:150px\">First</th><th style=\"width:150px\">Last</th><th>Most visited</th></tr></thead><tbody>${testerRows}</tbody></table></div>` : ''}\n        ${recs.length ? `<div class=\"section\"><h3>Recordings (voice and screen)</h3><table><thead><tr><th>Tester</th><th style=\"width:170px\">Started</th><th class=\"num\">Size</th><th>Play</th><th class=\"actions\"></th></tr></thead><tbody>${recRows}</tbody></table></div>` : ''}\n        <div class=\"section\"><h3>Moderator note</h3>\n          <div class=\"row\"><select id=\"noteWho\" style=\"width:220px\">${noteWho}</select>\n            <input type=\"text\" id=\"noteText\" placeholder=\"What you observed…\" style=\"flex:1;width:auto\">\n            <button class=\"btn\" id=\"noteAdd\">Add note</button></div></div>\n        <div class=\"section\"><h3>Feedback, answers, task notes and moderator notes</h3>\n          ${feedback.length ? `<ul class=\"timeline\">${feedback.slice().reverse().map(feedbackRow).join('')}</ul>` : '<p class=\"muted\" style=\"margin:0\">Nothing yet.</p>'}\n        </div>\n      </div>`;\n    $('#expMd').onclick = () => download(`/shares/${share.id}/report`, `report-${share.id}.md`);\n    $('#expCsv').onclick = () => download(`/shares/${share.id}/events?format=csv`, `events-${share.id}.csv`);\n    $('#expJson').onclick = () => download(`/shares/${share.id}/report?format=json`, `share-${share.id}.json`);\n    $('#live').onclick = () => {\n      if (liveTimer) stopLive();\n      else liveTimer = setInterval(draw, 5000);\n      draw();\n    };\n    t.querySelectorAll('[data-rec]').forEach((a) => {\n      a.onplay = async () => {\n        if (!a.src) {\n          a.src = await blobUrl(`/shares/${share.id}/recordings/${a.dataset.rec}`);\n          a.play();\n        }\n      };\n    });\n    t.querySelectorAll('[data-recdl]').forEach((b) => {\n      b.onclick = () => {\n        const mime = t.querySelector(`[data-rec=\"${b.dataset.recdl}\"]`).dataset.mime;\n        download(\n          `/shares/${share.id}/recordings/${b.dataset.recdl}`,\n          `${mime.startsWith('video/') ? 'screen' : 'voice'}-${b.dataset.recdl}.${mime.split('/')[1]}`\n        );\n      };\n    });\n    t.querySelectorAll('[data-recrm]').forEach((b) => {\n      b.onclick = async () => {\n        if (!confirm('Delete this recording?')) return;\n        await api(`/shares/${share.id}/recording
