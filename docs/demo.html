s/${b.dataset.recrm}`, { method: 'DELETE' });\n        draw();\n      };\n    });\n    $('#noteAdd').onclick = async () => {\n      const text = $('#noteText').value.trim();\n      if (!text) return;\n      await api(`/shares/${share.id}/notes`, {\n        method: 'POST',\n        body: JSON.stringify({ text, viewerId: $('#noteWho').value || undefined }),\n      });\n      toast('Note added');\n      draw();\n    };\n    $('#noteText').onkeydown = (e) => {\n      if (e.key === 'Enter') $('#noteAdd').click();\n    };\n  };\n  await draw();\n  if (share.mode === 'moderated' && !liveTimer) {\n    liveTimer = setInterval(draw, 5000);\n    draw();\n  }\n}\n\n// ---- Settings & files\nfunction tabSettings(t, share) {\n  const domains = me.server.sso\n    ? `<div class=\"field\"><label>SSO: also allow these email domains (comma separated)</label>\n         <input type=\"text\" id=\"sDomains\" value=\"${esc(share.ssoAllow.domains.join(', '))}\"></div>`\n    : '';\n  t.innerHTML = `\n    <div class=\"detail-cols\">\n      <div class=\"stack\" style=\"gap:var(--s7)\">\n        <div class=\"section\"><h3>Share</h3>\n          <div class=\"field\"><label>Name</label><input type=\"text\" id=\"sName\" value=\"${esc(share.name)}\"></div>\n          ${modeSeg(share.mode)}\n          <div class=\"stack\" id=\"testSetup\">${taskEditor(share.tasks)}${optionChecks(share)}</div>\n          <div class=\"field\"><label>Passcode (blank keeps the current one, \"none\" removes it)</label><input type=\"text\" id=\"sPass\" autocomplete=\"off\"></div>\n          ${domains}\n        </div>\n        ${introEditor(share.intro, share)}\n        <div class=\"field\"><label>Notes</label><textarea id=\"sNotes\" style=\"min-height:64px\">${esc(share.notes)}</textarea></div>\n        <div class=\"row\"><button class=\"btn primary\" id=\"save\">Save</button></div>\n      </div>\n      <div class=\"stack\" style=\"gap:var(--s7)\">\n        <div class=\"section\"><h3>Files</h3>\n          <div class=\"field\"><label>Replace prototype files</label>\n            <div class=\"drop\" id=\"drop2\">Drop a folder here, or click to choose<input type=\"file\" id=\"fileR\" multiple webkitdirectory></div>\n            <div class=\"hint\" id=\"rstat\"></div></div>\n          <div class=\"field\"><label>Files in this share (${share.filePaths.length}) · opens <span class=\"mono\">${esc(share.entry || '')}</span></label>\n            <div class=\"filelist\">${share.filePaths.map(esc).join('<br>') || '—'}</div></div>\n        </div>\n        <div class=\"section sep\" style=\"padding-top:var(--s5)\"><h3>Danger zone</h3>\n          <div class=\"row\"><button class=\"btn danger\" id=\"del\">Delete share and all data</button></div>\n          <div class=\"hint\">Removes the files, recordings, viewers, access log, feedback and recorded events. Cannot be undone.</div>\n        </div>\n      </div>\n    </div>`;\n  wireModeSeg();\n  wireTaskEditor();\n  wireOptions();\n  wireIntroEditor(share.id, null);\n  $('#save').onclick = async () => {\n    const body = {\n      name: $('#sName').value,\n      mode: modeValue(),\n      tasks: taskValue(),\n      notes: $('#sNotes').value,\n      intro: introValue(),\n      ...optionValues(),\n    };\n    const p = $('#sPass').value.trim();\n    if (p === 'none') body.passcode = '';\n    else if (p) body.passcode = p;\n    if ($('#sDomains'))\n      body.ssoAllow = {\n        emails: share.ssoAllow.emails,\n        domains: $('#sDomains')\n          .value.split(',')\n          .map((s) => s.trim())\n          .filter(Boolean),\n      };\n    try {\n      await api('/shares/' + share.id, { method: 'PATCH', body: JSON.stringify(body) });\n      toast('Saved');\n      render();\n    } catch (e) {\n      alert(e.message);\n    }\n  };\n  const d2 = $('#drop2');\n  d2.onclick = (e) => {\n    if (e.target.tagName !== 'INPUT') $('#fileR').click();\n  };\n  d2.ondragover = (e) => e.preventDefault();\n  const replace = async (list) => {\n    $('#rstat').textContent = 'Uploading…';\n    try {\n      const files = [];\n      for (const { path, file } of list) {\n        if (/(^|\\/)(node_modules|\\.git|__MACOSX)\\//.test(path) || /\\.DS_Store$/.test(path)) continue;\n        files.push({ path, contentBase64: b64(new Uint8Array(await file.arrayBuffer())) });\n      }\n      await api('/shares/' + share.id + '/bundle', { method: 'PUT', body: JSON.stringify({ files }) });\n      toast('Files replaced');\n      render();\n    } catch (e) {\n      $('#rstat').textContent = e.message;\n    }\n  };\n  d2.ondrop = async (e) => {\n    e.preventDefault();\n    replace(await filesFromDrop(e));\n  };\n  $('#fileR').onchange = (e) =>\n    replace([...e.target.files].map((f) => ({ path: f.webkitRelativePath || f.name, file: f })));\n  $('#del').onclick = async () => {\n    if (!confirm('Delete this share and every record attached to it?')) return;\n    await api('/shares/' + share.id, { method: 'DELETE' });\n    toast('Deleted');\n    view = { page: 'list' };\n    render();\n  };\n}\n<\/script>\n    <script>'use strict';\n// Account page: who you are, connected tools (personal access tokens), leave, recent activity.\n/* exported renderAccount */\n/* global $, esc, fmt, toast, api, copy, ask, signOut, shell, wireShell, render */\n\nasync function renderAccount(app) {\n  app.innerHTML = shell(\n    '<div class=\"pagehead\"><h1>Account</h1></div><div id=\"acct\"><p class=\"muted\">Loading…</p></div>',\n    'account'\n  );\n  wireShell();\n  const [{ tokens }, { activity }] = await Promise.all([api('/tokens'), api('/activity')]);\n  const id = me.identity;\n  const s = me.server;\n  const active = tokens.filter((t) => !t.revokedAt);\n  const isServerToken = id.kind === 'server-token' || id.who === 'admin-token';\n\n  const how =\n    id.kind === 'google'\n      ? 'Google sign-in'\n      : id.kind === 'sso'\n        ? `Company sign-in (${esc(s.sso ? 'identity header from your proxy' : 'SSO')})`\n        : id.kind === 'server-token'\n          ? 'Server admin token'\n          : `Personal access token${id.tokenId ? ' · ' + esc((tokens.find((t) => t.id === id.tokenId) || {}).name || '') : ''}`;\n  const browser =\n    id.kind === 'sso'\n      ? 'Stays signed in while your company session lasts.'\n      : id.kind === 'google'\n        ? 'Signed in for 30 days, or until you sign out.'\n        : 'Signed in until you close this tab or sign out.';\n  const lim = me.mine.limits || {};\n  const limits = [\n    lim.shares ? `${me.mine.shares} of ${lim.shares} shares` : '',\n    lim.storageMb ? `${lim.storageMb} MB of prototype files` : '',\n  ]\n    .filter(Boolean)\n    .join(' · ');\n  const signOutRow =\n    (id.kind !== 'sso' ? '<button class=\"btn\" id=\"out\">Sign out</button>' : '') +\n    (s.ssoLogoutUrl\n      ? `<a class=\"btn\" href=\"${esc(s.ssoLogoutUrl)}\">Sign out of company sign-in</a>`\n      : id.kind === 'sso'\n        ? '<span class=\"hint\">To sign out, sign out of your company identity provider. Ask whoever runs the Vantage to set SSO_LOGOUT_URL for a button here.</span>'\n        : '');\n\n  const toolRow = (t) => `\n    <tr>\n      <td><b>${esc(t.name)}</b>${t.current ? ' <span class=\"pill active\">this session</span>' : ''}<br><span class=\"muted mono\">${esc(t.prefix)}…</span></td>\n      <td>${fmt(t.createdAt)}</td><td>${t.lastUsedAt ? fmt(t.lastUsedAt) : 'Never'}</td><td class=\"muted\">${esc(t.owner)}</td>\n      <td class=\"actions\"><button class=\"btn small danger\" data-disc=\"${t.id}\" data-name=\"${esc(t.name)}\">Disconnect</button></td>\n    </tr>`;\n  const oldRow = (t) => `\n    <tr class=\"muted\"><td>${esc(t.name)}</td><td style=\"width:170px\">connected ${fmt(t.createdAt)}</td>\n      <td style=\"width:170px\">disconnected ${fmt(t.revokedAt)}</td><td>${esc(t.owner)}</td></tr>`;\n  const tools = active.length\n    ? `<table><thead><tr><th>Tool</th><th style=\"width:170px\">Connected</th><th style=\"width:170px\">Last used</th><th>Owner</th><th class=\"actions\"></th></tr></thead>\n       <tbody>${active.map(toolRow).join('')}</tbody></table>`\n    : '<p class=\"muted\" style=\"margin:0\">No tools connected yet.</p>';\n  const disconnected =\n    tokens.length > active.length\n      ? `<details><summary class=\"hint\" style=\"cursor:pointer\">Disconnected (${tokens.length - active.length})</summary>\n         <table style=\"margin-top:var(--s2)\"><tbody>${tokens\n           .filter((t) => t.revokedAt)\n           .map(oldRow)\n           .join('')}</tbody></table></details>`\n      : '';\n  const n = me.mine.shares;\n  const k = me.mine.tokens;\n  const leaveBlock = isServerToken\n    ? '<div class=\"hint\">You are using the shared server admin token, which is not a personal account. To stop using this, delete your shares from the Prototypes page and ask whoever runs the server to rotate the token.</div>'\n    : `<div class=\"hint\">If you no longer want to use this, you can delete everything you made here in one go: the ${n} prototype${n === 1 ? '' : 's'} you shared (files, viewer links, recordings, feedback and results) and the ${k} connected tool${k === 1 ? '' : 's'}. It cannot be undone.</div>\n       <div class=\"row\"><button class=\"btn danger\" id=\"leave\">Delete everything I made and leave</button></div>`;\n  const activityRow = (a) => `\n    <li><span class=\"ts\">${esc(a.ts.replace('T', ' ').slice(0, 19))}</span><b>${esc(a.type)}</b> ${a.name ? esc(a.name) : ''}\n      ${a.path ? '<span class=\"mono\">' + esc(a.path) + '</span>' : ''} <span class=\"muted\">${esc(a.ip || '')}${a.by ? ' by ' + esc(a.by) : ''}</span></li>`;\n\n  $('#acct').innerHTML = `\n    <div class=\"stack\" style=\"gap:var(--s6)\">\n      <div class=\"card\"><div class=\"section\"><h3>You</h3>\n        <dl class=\"kv\"><dt>Signed in as</dt><dd>${esc(id.who)}</dd><dt>How</dt><dd>${how}</dd><dt>This browser</dt><dd>${browser}</dd>\n          ${limits ? `<dt>Limits</dt><dd>${limits}</dd>` : ''}</dl>\n        <div class=\"row\">${signOutRow}</div>\n      </div></div>\n      <div class=\"card\"><div class=\"section\"><h3>Connected tools</h3>\n        <div class=\"hint\">Claude Code, the CLI and the MCP server publish with a personal access token. Each tool gets its\n          own, so you can disconnect one without touching the others. Disconnecting is immediate; nothing already shared changes.</div>\n        ${tools}\n        <div class=\"row\"><input type=\"text\" id=\"tname\" placeholder=\"Name the tool, e.g. Claude Code on my laptop\" style=\"flex:1;width:auto\" maxlength=\"60\">\n          <button class=\"btn primary\" id=\"tadd\">Connect a tool</button></div>\n        <div id=\"tnew\"></div>\n        ${disconnected}\n      </div></div>\n      <div class=\"card\"><div class=\"section\"><h3>Leave Vantage</h3>${leaveBlock}</div></div>\n      <div class=\"card\"><div class=\"section\"><h3>Recent account activity</h3>\n        ${activity.length ? `<ul class=\"timeline\">${activity.slice(0, 30).map(activityRow).join('')}</ul>` : '<p class=\"muted\" style=\"margin:0\">Nothing yet.</p>'}\n        <div class=\"hint\">Sign-ins, failed attempts, tools connected or disconnected, shares created, revoked or deleted. The full log is in the data directory.</div>\n      </div></div>\n    </div>`;\n\n  if ($('#out')) $('#out').onclick = signOut;\n  if ($('#leave'))\n    $('#leave').onclick = async () => {\n      const extra =\n        id.kind === 'sso'\n          ? ' Your company sign-in is managed by your company; ask IT to remove you from the admin list as well.'\n          : '';\n      const ok = await ask(\n        'Leave Vantage?',\n        `This deletes the ${n} prototype${n === 1 ? '' : 's'} you shared, with their files, viewer links, recordings, feedback and results, disconnects your ${k} tool${k === 1 ? '' : 's'}, and signs you out. It cannot be undone.${extra}`,\n        'Delete everything and leave',\n        true\n      );\n      if (!ok) return;\n      try {\n        left = await api('/me/leave', { method: 'POST' });\n        sessionStorage.removeItem('vantage_token');\n        token = '';\n        me = null;\n        render();\n      } catch (e) {\n        alert(e.message);\n      }\n    };\n  if (view.newToken) {\n    showNewToken(view.newToken);\n    view.newToken = null;\n  }\n  $('#tadd').onclick = async () => {\n    const name = $('#tname').value.trim();\n    if (!name) return $('#tname').focus();\n    try {\n      view.newToken = await api('/tokens', { method: 'POST', body: JSON.stringify({ name }) });\n      render();\n    } catch (e) {\n      alert(e.message);\n    }\n  };\n  $('#tname').onkeydown = (e) => {\n    if (e.key === 'Enter') $('#tadd').click();\n  };\n  $('#acct')\n    .querySelectorAll('[data-disc]')\n    .forEach((b) => {\n      b.onclick = async () => {\n        const ok = await ask(\n          `Disconnect ${esc(b.dataset.name)}?`,\n          'It stops working right away. To use that tool again you would connect it with a new token. Prototypes it already shared are not affected.',\n          'Disconnect',\n          true\n        );\n        if (!ok) return;\n        await api('/tokens/' + b.dataset.disc, { method: 'DELETE' });\n        toast('Disconnected');\n        if (b.dataset.disc === me.identity.tokenId) return signOut();\n        render();\n      };\n    });\n}\n\n// The token is shown once, with the two setup lines a person copies into their tools.\nfunction showNewToken(r) {\n  const url = me.server.publicUrl;\n  const mcp = me.server.mcpPath || '/path/to/vantage/mcp/server.js';\n  $('#tnew').innerHTML = `\n    <div class=\"card\" style=\"background:var(--bg);margin-top:var(--s3)\"><div class=\"stack\" style=\"gap:var(--s3)\">\n      <div><b>${esc(r.item.name)}</b> is connected. Copy the token now; it is shown only once.</div>\n      <div class=\"tokenbox\" id=\"tokval\">${esc(r.token)}</div>\n      <div class=\"row\"><button class=\"btn primary\" id=\"tcopy\">Copy token</button><button class=\"btn\" id=\"tcli\">Copy CLI setup</button><button class=\"btn\" id=\"tmcp\">Copy Claude Code setup</button></div>\n      <div class=\"hint\">CLI and MCP read <span class=\"mono\">VANTAGE_URL</span> and <span class=\"mono\">VANTAGE_ADMIN_TOKEN</span>.\n        In Claude Code: <span class=\"mono\">claude mcp add vantage -e VANTAGE_URL=${esc(url)} -e VANTAGE_ADMIN_TOKEN=… -- node \"${esc(mcp)}\"</span>\n        (the path to mcp/server.js in your copy of the repository).</div>\n    </div></div>`;\n  $('#tcopy').onclick = () => copy(r.token);\n  $('#tcli').onclick = () => copy(`export VANTAGE_URL=${url} VANTAGE_ADMIN_TOKEN=${r.token}`);\n  $('#tmcp').onclick = () =>\n    copy(`claude mcp add vantage -e VANTAGE_URL=${url} -e VANTAGE_ADMIN_TOKEN=${r.token} -- node \"${mcp}\"`);\n}\n<\/script>\n  <script>\n// Two console helpers rebound for a framed page: exports go to the parent page, which saves them the way its host\n// allows; copying uses the copy command, which needs no clipboard permission.\ndownload = async (path, name) => { const r = await fetch('/api' + path); if (!r.ok) return toast('Export failed'); parent.postMessage({ proto: 'download', name, blob: await r.blob() }, '*'); };\ncopy = (t) => { const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (e) {} ta.remove(); if (ok) toast('Copied'); else prompt('Copy this', t); };\ndocument.addEventListener('DOMContentLoaded',()=>{const S=window.__SCREEN;if(S.view)view=S.view;if(S.left)left=S.left;if(S.after)setTimeout(()=>{try{new Function(S.after)()}catch(e){}},700)})<\/script></body>\n</html>\n","viewer":"<!doctype html>\n<html lang=\"en\">\n  <head>\n    <meta charset=\"utf-8\" />\n    <meta name=\"viewport\" content=\"width=device-width,initial-scale=1\" />\n    <meta name=\"robots\" content=\"noindex,nofollow\" />\n    <meta name=\"referrer\" content=\"no-referrer\" />\n    <title>Prototype</title>\n
