// ---------- Drawing ----------
const COL = 300, ROW = 118, W = 190, H = 72, DW = 220, DH = 92, PAD = 40;
const $ = (s) => document.querySelector(s);

function size(n) { return n.type === 'decision' ? [DW, DH] : n.type === 'conn' ? [44, 44] : n.type === 'note' ? [W + 30, H] : [W, H]; }
function center(n) { return [PAD + n.c * COL + DW / 2, PAD + n.r * ROW + DH / 2]; }

function wrap(text, max) {
  const words = text.split(' '), lines = []; let cur = '';
  for (const w of words) { if ((cur + ' ' + w).trim().length > max) { lines.push(cur.trim()); cur = w; } else cur += ' ' + w; }
  if (cur.trim()) lines.push(cur.trim());
  return lines;
}

function shapePath(n, cx, cy) {
  const [w, h] = size(n), x = cx - w / 2, y = cy - h / 2;
  switch (n.type) {
    case 'start': case 'end-bad': case 'end-good':
      return `<rect class="shape" x="${x}" y="${y}" width="${w}" height="${h}" rx="${h / 2}"/>`;
    case 'decision':
      return `<polygon class="shape" points="${cx},${y} ${x + w},${cy} ${cx},${y + h} ${x},${cy}"/>`;
    case 'io':
      return `<polygon class="shape" points="${x + 18},${y} ${x + w},${y} ${x + w - 18},${y + h} ${x},${y + h}"/>`;
    case 'data': {
      const ry = 10;
      return `<path class="shape" d="M${x},${y + ry} a${w / 2},${ry} 0 0 1 ${w},0 v${h - 2 * ry} a${w / 2},${ry} 0 0 1 ${-w},0 z"/><path class="shape" d="M${x},${y + ry} a${w / 2},${ry} 0 0 0 ${w},0" fill="none"/>`;
    }
    case 'doc':
      return `<path class="shape" d="M${x},${y} h${w} v${h - 12} q${-w / 4},-14 ${-w / 2},0 q${-w / 4},14 ${-w / 2},0 z"/>`;
    case 'conn':
      return `<circle class="shape" cx="${cx}" cy="${cy}" r="${w / 2}"/>`;
    case 'place':
      return `<rect class="shape" x="${x}" y="${y}" width="${w}" height="${h}" rx="14"/>`;
    case 'note':
      return `<path class="shape" d="M${x + 12},${y} h-12 v${h} h12"/>`;
    case 'sub':
      return `<rect class="shape" x="${x}" y="${y}" width="${w}" height="${h}" rx="4"/><path class="shape" d="M${x + 8},${y} v${h} M${x + w - 8},${y} v${h}" fill="none"/>`;
    default:
      return `<rect class="shape" x="${x}" y="${y}" width="${w}" height="${h}" rx="6"/>`;
  }
}

function edgePath(e, a, b) {
  const [ax, ay] = center(a), [bx, by] = center(b), [aw, ah] = size(a), [bw, bh] = size(b);
  let pts;
  const route = e.route || (a.r === b.r ? (b.c > a.c ? 'right' : 'left') : 'down');
  if (route === 'right') pts = [[ax + aw / 2, ay], [bx - bw / 2, by]];
  else if (route === 'left') pts = [[ax - aw / 2, ay], [bx + bw / 2, by]];
  else if (route === 'loopBelow') { const yy = ay + ah / 2 + 22; pts = [[ax, ay + ah / 2], [ax, yy], [bx, yy], [bx, by + bh / 2]]; }
  else if (route === 'upRight') { // out of the right side, then up or down into the target's left side
    const xx = e.lane === 'near' ? ax + aw / 2 + 24 : (ax + aw / 2 + bx - bw / 2) / 2;
    pts = [[ax + aw / 2, ay], [xx, ay], [xx, by], [bx - bw / 2, by]];
  }
  else if (route === 'loopLeft') { // out of the left side, up or down a lane on the left, into the target's left side
    const lane = e.lane === 'far' ? 14 : Math.min(ax - aw / 2, bx - bw / 2) - 36;
    pts = [[ax - aw / 2, ay], [lane, ay], [lane, by], [bx - bw / 2, by]];
  }
  else if (route === 'downSide') { // straight down to the target's row, then sideways into its side
    const side = bx < ax ? bx + bw / 2 : bx - bw / 2;
    pts = [[ax, ay + ah / 2], [ax, by], [side, by]];
  }
  else if (route === 'loopUp') { // out of the right side, up a side lane, into the target's right side (a "go back" loop)
    const lane = Math.max(ax + aw / 2, bx + bw / 2) + 36;
    pts = [[ax + aw / 2, ay], [lane, ay], [lane, by], [bx + bw / 2, by]];
  }
  else if (route === 'downLeft') { // straight down, then across just above the target, so it crosses nothing
    const yy = by - bh / 2 - 16; pts = [[ax, ay + ah / 2], [ax, yy], [bx, yy], [bx, by - bh / 2]];
  }
  else { // down
    if (ax === bx) pts = [[ax, ay + ah / 2], [bx, by - bh / 2]];
    else { const yy = (ay + ah / 2 + by - bh / 2) / 2; pts = [[ax, ay + ah / 2], [ax, yy], [bx, yy], [bx, by - bh / 2]]; }
  }
  // Label: on the first straight run if it is long enough to hold a pill, else on the longest run.
  const segs = pts.slice(1).map((p, i) => ({ x: (pts[i][0] + p[0]) / 2, y: (pts[i][1] + p[1]) / 2, len: Math.hypot(p[0] - pts[i][0], p[1] - pts[i][1]) }));
  const seg = segs[0].len >= 34 ? segs[0] : segs.reduce((m, s) => (s.len > m.len ? s : m));
  return { d: 'M' + pts.map((p) => p.join(',')).join(' L'), lx: seg.x, ly: seg.y };
}

function render(id) {
  const D = DIAGRAMS[id];
  $('#dTitle').textContent = D.title; $('#dDesc').textContent = D.desc;
  const byId = Object.fromEntries(D.nodes.map((n) => [n.id, n]));
  const cols = Math.max(...D.nodes.map((n) => n.c)) + 1, rows = Math.max(...D.nodes.map((n) => n.r)) + 1;
  const width = PAD * 2 + (cols - 1) * COL + DW + 60, height = PAD * 2 + (rows - 1) * ROW + DH + 30;
  let svg = `<svg viewBox="0 0 ${width} ${height}" width="${width}" height="${height}" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>`;
  for (const e of D.edges) {
    const { d, lx, ly } = edgePath(e, byId[e.from], byId[e.to]);
    const tip = e.tip ? ` data-tip="${esc(e.tip)}" data-title="Arrow"` : '';
    svg += `<g class="edge ${e.kind || ''}" data-from="${e.from}" data-to="${e.to}"${tip}><path d="${d}" marker-end="url(#arr)"${e.dashed ? ' stroke-dasharray="4 3"' : ''}/>` +
      (e.label ? `<g class="lbl"><rect rx="9" x="${lx}" y="${ly - 9}" height="18"/><text x="${lx}" y="${ly}">${esc(e.label)}</text></g>` : '') + `</g>`;
  }
  for (const n of D.nodes) {
    const [cx, cy] = center(n), lines = wrap(n.label, n.type === 'decision' ? 20 : n.type === 'conn' ? 6 : n.type === 'note' ? 32 : 27);
    const y0 = cy - (lines.length - 1) * 7;
    svg += `<g class="node ${n.type}" data-title="${esc(n.label)}" data-shape="${SHAPE_NAMES[n.type]}" data-tip="${esc(n.tip)}" tabindex="0">${shapePath(n, cx, cy)}` +
      `<text text-anchor="middle">${lines.map((l, i) => `<tspan x="${cx}" y="${y0 + i * 14 + 4}">${esc(l)}</tspan>`).join('')}</text></g>`;
  }
  svg += '</svg>';
  $('#canvas').innerHTML = svg;
  for (const g of document.querySelectorAll('.lbl')) { const b = g.querySelector('text').getBBox(), r = g.querySelector('rect'); r.setAttribute('x', b.x - 6); r.setAttribute('width', b.width + 12); }
  for (const g of document.querySelectorAll('[data-tip]')) {
    const show = () => { $('#eShape').textContent = g.dataset.shape || ''; $('#eTitle').textContent = g.dataset.title; $('#eTip').textContent = g.dataset.tip; $('#aside').classList.add('open'); };
    g.addEventListener('mouseenter', show); g.addEventListener('focus', show); g.addEventListener('click', show);
  }
  for (const b of document.querySelectorAll('nav button')) b.classList.toggle('active', b.dataset.id === id);
  $('#pick').value = id;
  $('#aside').classList.remove('open');
  // Open scrolled to the start of the story (the first start oval), so a narrow screen does not begin on a side column.
  const first0 = D.nodes.filter((n) => n.r === 0 && (n.type === 'start' || n.type === 'sub')).sort((p, q) => p.c - q.c)[0] || D.nodes[0];
  const cv = $('#canvas'); cv.scrollLeft = Math.max(0, center(first0)[0] - cv.clientWidth / 2);
  try { localStorage.setItem('vantage-flow', id); } catch (e) {}
}

function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }

// Sidebar
const nav = $('#nav');
for (const [group, items] of MASTER) {
  nav.insertAdjacentHTML('beforeend', `<h2>${group}</h2>`);
  for (const it of items) {
    const id = it.split(' ')[0], b = document.createElement('button');
    b.textContent = it; b.dataset.id = id; b.disabled = !DIAGRAMS[id];
    b.addEventListener('click', () => render(id)); nav.appendChild(b);
  }
}
// Layout check for whoever draws the next diagram: run check() in the browser console. Returns {} when every diagram is
// clean, otherwise a list of arrows that cross a shape they are not attached to, and labels with too many lines.
window.check = function () {
  const out = {}, keep = document.querySelector('nav button.active')?.dataset.id;
  for (const id of Object.keys(DIAGRAMS)) {
    render(id);
    const svg = document.querySelector('svg');
    const nodes = [...svg.querySelectorAll('.node')].map((g) => { const b = g.querySelector('.shape').getBBox(); return { t: g.dataset.title, x: b.x, y: b.y, w: b.width, h: b.height, lines: g.querySelectorAll('tspan').length, type: [...g.classList].find((c) => c !== 'node') }; });
    const probs = [];
    for (const n of nodes) { const max = n.type === 'decision' ? 4 : n.type === 'conn' ? 1 : 5; if (n.lines > max) probs.push(`overflow ${n.lines} lines: ${n.t.slice(0, 40)}`); }
    for (const e of svg.querySelectorAll('.edge path')) {
      const pts = e.getAttribute('d').match(/-?[\d.]+,-?[\d.]+/g).map((p) => p.split(',').map(Number));
      for (let i = 0; i < pts.length - 1; i++) {
        const [x1, y1] = pts[i], [x2, y2] = pts[i + 1];
        for (const n of nodes) {
          let hit = false;
          for (let t = 0.02; t < 0.98; t += 0.02) { const x = x1 + (x2 - x1) * t, y = y1 + (y2 - y1) * t; if (x > n.x + 2 && x < n.x + n.w - 2 && y > n.y + 2 && y < n.y + n.h - 2) { hit = true; break; } }
          if (hit) probs.push(`line through "${n.t.slice(0, 35)}" seg ${i}`);
        }
      }
    }
    // Arrows that cross or lie on top of each other are a tangle. Two arrows may share a final segment into the same
    // shape (a merge); anything else is reported.
    const edges = [...svg.querySelectorAll('.edge path')].map((e) => ({ pts: e.getAttribute('d').match(/-?[\d.]+,-?[\d.]+/g).map((p) => p.split(',').map(Number)), to: e.parentNode.dataset.to, from: e.parentNode.dataset.from }));
    const cross = (a, b, c, d) => { const o = (p, q, r) => Math.sign((q[0] - p[0]) * (r[1] - p[1]) - (q[1] - p[1]) * (r[0] - p[0])); return o(a, b, c) * o(a, b, d) < 0 && o(c, d, a) * o(c, d, b) < 0; };
    const overlap = (a, b, c, d) => { // collinear horizontal or vertical segments sharing more than a point
      if (a[1] === b[1] && c[1] === d[1] && a[1] === c[1]) return Math.min(Math.max(a[0], b[0]), Math.max(c[0], d[0])) - Math.max(Math.min(a[0], b[0]), Math.min(c[0], d[0])) > 4;
      if (a[0] === b[0] && c[0] === d[0] && a[0] === c[0]) return Math.min(Math.max(a[1], b[1]), Math.max(c[1], d[1])) - Math.max(Math.min(a[1], b[1]), Math.min(c[1], d[1])) > 4;
      return false;
    };
    for (let i = 0; i < edges.length; i++) for (let j = i + 1; j < edges.length; j++) {
      const A = edges[i], B = edges[j];
      for (let x = 0; x < A.pts.length - 1; x++) for (let y = 0; y < B.pts.length - 1; y++) {
        const lastA = x === A.pts.length - 2, lastB = y === B.pts.length - 2, merge = A.to === B.to && lastA && lastB;
        const fork = A.from === B.from && x === 0 && y === 0;
        if (merge || fork) continue;
        if (cross(A.pts[x], A.pts[x + 1], B.pts[y], B.pts[y + 1])) probs.push(`arrows cross: ${A.from}→${A.to} and ${B.from}→${B.to}`);
        else if (A.from !== B.from && A.to !== B.to && overlap(A.pts[x], A.pts[x + 1], B.pts[y], B.pts[y + 1])) probs.push(`arrows overlap: ${A.from}→${A.to} and ${B.from}→${B.to}`);
      }
    }
    for (const l of svg.querySelectorAll('.lbl rect')) {
      const b = l.getBBox();
      for (const n of nodes) if (b.x < n.x + n.w - 2 && b.x + b.width > n.x + 2 && b.y < n.y + n.h - 2 && b.y + b.height > n.y + 2) probs.push(`label "${l.nextElementSibling.textContent}" touches "${n.t.slice(0, 30)}"`);
    }
    if (probs.length) out[id] = probs;
  }
  if (keep) render(keep);
  return out;
};

const ORDER = MASTER.flatMap(([, items]) => items.map((it) => it.split(' ')[0])).filter((id) => DIAGRAMS[id]);
for (const [group, items] of MASTER) {
  const og = document.createElement('optgroup'); og.label = group;
  for (const it of items) { const id = it.split(' ')[0]; if (!DIAGRAMS[id]) continue; const o = document.createElement('option'); o.value = id; o.textContent = it; og.appendChild(o); }
  if (og.children.length) $('#pick').appendChild(og);
}
$('#pick').addEventListener('change', (e) => render(e.target.value));
const step = (d) => { const i = ORDER.indexOf($('#pick').value); render(ORDER[(i + d + ORDER.length) % ORDER.length]); window.scrollTo(0, 0); };
$('#prev').addEventListener('click', () => step(-1));
$('#next').addEventListener('click', () => step(1));
$('#fit').addEventListener('click', () => { const on = $('#canvas').classList.toggle('fit'); $('#fit').classList.toggle('on', on); });
$('#asideClose').addEventListener('click', () => $('#aside').classList.remove('open'));
$('#asideTitle').addEventListener('click', () => $('#aside').classList.toggle('open'));
let first = 'D00';
try { const saved = localStorage.getItem('vantage-flow'); if (saved && DIAGRAMS[saved]) first = saved; } catch (e) {}
render(first);
</script>
</body>
