<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Vantage</title>
    <link rel="stylesheet" href="/vantage.css" />
    <style>
      #app {
        min-height: 100%;
        display: flex;
        flex-direction: column;
      }
      #app > .gate {
        flex: 1;
      }
      .wrap {
        width: 100%;
        max-width: var(--page-w);
        margin: 0 auto;
        padding: var(--s7) var(--gutter) 0;
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      .pagehead {
        display: flex;
        align-items: flex-start;
        gap: var(--s3);
        margin-bottom: var(--s6);
      }
      .pagehead h1 {
        font-size: 20px;
        line-height: 28px;
        margin: 0;
      }
      .pagehead .spacer {
        flex: 1;
      }
      .shares .head,
      .shares .item {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 72px 72px 96px;
        gap: var(--s4);
        align-items: center;
      }
      .shares .head {
        padding: 0 var(--s2) var(--s2);
        font-size: 12px;
        line-height: 16px;
        color: var(--muted);
        font-weight: 500;
        border-bottom: 1px solid var(--line);
      }
      .shares .head .r {
        text-align: right;
      }
      .shares .item {
        padding: var(--s3) var(--s2);
        border-bottom: 1px solid var(--line);
        cursor: pointer;
      }
      .shares .item:last-child {
        border-bottom: 0;
      }
      .shares .item:hover {
        background: var(--bg);
      }
      .shares .item .n {
        font-weight: 600;
      }
      .shares .item .m {
        font-size: 12px;
        line-height: 16px;
        color: var(--muted);
      }
      @media (max-width: 700px) {
        .shares .head,
        .shares .item {
          grid-template-columns: minmax(0, 1fr) auto auto auto;
          gap: var(--s3);
        }
        .tabs {
          overflow-x: auto;
        }
        .tabs button {
          white-space: nowrap;
        }
      }
      .shares .item .pillcell {
        display: flex;
        justify-content: flex-end;
      }
      .tabs {
        display: flex;
        gap: var(--s1);
        border-bottom: 1px solid var(--line);
        margin: var(--s5) 0;
      }
      .tabs button {
        height: 36px;
        border: 0;
        background: none;
        padding: 0 var(--s3);
        cursor: pointer;
        color: var(--muted);
        border-bottom: 2px solid transparent;
        margin-bottom: -1px;
        font-weight: 500;
      }
      .tabs button.on {
        color: var(--ink);
        border-color: var(--accent);
      }
      .stats {
        display: flex;
        gap: var(--s6);
        align-items: flex-end;
        flex-wrap: wrap;
      }
      .stat b {
        display: block;
        font-size: 20px;
        line-height: 28px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .stat span {
        font-size: 12px;
        line-height: 16px;
        color: var(--muted);
      }
      .drop {
        border: 1.5px dashed var(--line);
        border-radius: var(--r-control);
        padding: var(--s5);
        text-align: center;
        color: var(--muted);
        cursor: pointer;
        min-height: var(--touch);
      }
      .drop.has {
        border-style: solid;
        color: var(--ink);
      }
      .drop input {
        display: none;
      }
      .link {
        font-family: var(--mono);
        font-size: 11px;
        line-height: 16px;
        word-break: break-all;
        color: var(--muted);
      }
      .warn {
        background: var(--warn-bg);
        color: var(--warn-ink);
        border-radius: var(--r-control);
        padding: var(--s3);
        font-size: 13px;
      }
      .timeline {
        padding: 0;
        margin: 0;
        list-style: none;
      }
      .timeline li {
        padding: var(--s2) 0;
        border-bottom: 1px solid var(--line);
        font-size: 13px;
      }
      .timeline .ts {
        color: var(--muted);
        font-family: var(--mono);
        font-size: 11px;
        margin-right: var(--s2);
      }
      .progress {
        height: 6px;
        background: var(--line);
        border-radius: var(--r-pill);
        overflow: hidden;
      }
      .progress i {
        display: block;
        height: 100%;
        background: var(--accent);
        width: 0;
      }
      .head-row {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: var(--s4);
        flex-wrap: wrap;
      }
      .head-row h2 {
        font-size: 20px;
        line-height: 28px;
        margin: 0;
        display: flex;
        align-items: center;
        gap: var(--s2);
        flex-wrap: wrap;
      }
      .detail-cols {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: var(--s6);
      }
      @media (max-width: 800px) {
        .detail-cols {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      .filelist {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--muted);
        max-height: 240px;
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: var(--r-control);
        padding: var(--s2) var(--s3);
      }
      .modal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.45);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 20;
        padding: var(--gutter);
      }
      .modal .card {
        max-width: 480px;
        width: 100%;
        padding: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .modal h1 {
        font-size: 18px;
        line-height: 24px;
        margin: 0;
        padding: var(--gutter) var(--gutter) var(--s3);
      }
      .modal .mbody {
        padding: 0 var(--gutter) var(--s5);
      }
      .modal .mbody p {
        margin: 0;
        color: var(--muted);
      }
      .modal .mfoot {
        padding: var(--s3) var(--gutter) var(--gutter);
        border-top: 1px solid var(--line);
        display: flex;
        justify-content: flex-end;
        gap: var(--s2);
      }
      .tokenbox {
        font-family: var(--mono);
        font-size: 12px;
        line-height: 18px;
        padding: var(--s3);
        border: 1px solid var(--line);
        border-radius: var(--r-control);
        background: var(--bg);
        word-break: break-all;
        white-space: pre-wrap;
      }
      .divider {
        display: flex;
        align-items: center;
        gap: var(--s3);
        color: var(--muted);
        font-size: 12px;
      }
      .divider::before,
      .divider::after {
        content: '';
        flex: 1;
        border-top: 1px solid var(--line);
      }
      .sep {
        border-top: 1px solid var(--line);
      }
      .kv {
        display: grid;
        grid-template-columns: 200px minmax(0, 1fr);
        gap: var(--s2) var(--s4);
        font-size: 13px;
      }
      .kv dt {
        color: var(--muted);
        margin: 0;
      }
      .kv dd {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <!-- One file per page. core.js holds shared helpers and the router and must load first; boot runs on DOMContentLoaded. -->
    <script src="/admin/core.js"></script>
    <script src="/admin/form.js"></script>
    <script src="/admin/signin.js"></script>
    <script src="/admin/list.js"></script>
    <script src="/admin/new-share.js"></script>
    <script src="/admin/share.js"></script>
    <script src="/admin/account.js"></script>
  </body>
</html>
