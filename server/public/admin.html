<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Prototype Vault</title><link rel="stylesheet" href="/vault.css">
<style>
#app{min-height:100%;display:flex;flex-direction:column}#app>.gate{flex:1}
.wrap{width:100%;max-width:var(--page-w);margin:0 auto;padding:var(--s7) var(--gutter) 0;flex:1;display:flex;flex-direction:column}
.pagehead{display:flex;align-items:flex-start;gap:var(--s3);margin-bottom:var(--s6)}.pagehead h1{font-size:20px;line-height:28px;margin:0}.pagehead .spacer{flex:1}
.shares .head,.shares .item{display:grid;grid-template-columns:minmax(0,1fr) 72px 72px 96px;gap:var(--s4);align-items:center}.shares .head{padding:0 var(--s2) var(--s2);font-size:12px;line-height:16px;color:var(--muted);font-weight:500;border-bottom:1px solid var(--line)}.shares .head .r{text-align:right}
.shares .item{padding:var(--s3) var(--s2);border-bottom:1px solid var(--line);cursor:pointer}.shares .item:last-child{border-bottom:0}.shares .item:hover{background:var(--bg)}.shares .item .n{font-weight:600}.shares .item .m{font-size:12px;line-height:16px;color:var(--muted)}.shares .item .pillcell{display:flex;justify-content:flex-end}
.tabs{display:flex;gap:var(--s1);border-bottom:1px solid var(--line);margin:var(--s5) 0}.tabs button{height:36px;border:0;background:none;padding:0 var(--s3);cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500}.tabs button.on{color:var(--ink);border-color:var(--accent)}
.stats{display:flex;gap:var(--s6);align-items:flex-end;flex-wrap:wrap}.stat b{display:block;font-size:20px;line-height:28px;font-weight:600;font-variant-numeric:tabular-nums}.stat span{font-size:12px;line-height:16px;color:var(--muted)}
.drop{border:1.5px dashed var(--line);border-radius:var(--r-control);padding:var(--s5);text-align:center;color:var(--muted);cursor:pointer;min-height:var(--touch)}.drop.has{border-style:solid;color:var(--ink)}.drop input{display:none}
.link{font-family:var(--mono);font-size:11px;line-height:16px;word-break:break-all;color:var(--muted)}
.warn{background:var(--warn-bg);color:var(--warn-ink);border-radius:var(--r-control);padding:var(--s3);font-size:13px}
.timeline{padding:0;margin:0;list-style:none}.timeline li{padding:var(--s2) 0;border-bottom:1px solid var(--line);font-size:13px}.timeline .ts{color:var(--muted);font-family:var(--mono);font-size:11px;margin-right:var(--s2)}
.progress{height:6px;background:var(--line);border-radius:var(--r-pill);overflow:hidden}.progress i{display:block;height:100%;background:var(--accent);width:0}
.head-row{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--s4);flex-wrap:wrap}.head-row h2{font-size:20px;line-height:28px;margin:0;display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
.detail-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s6)}@media(max-width:800px){.detail-cols{grid-template-columns:minmax(0,1fr)}}
.filelist{font-family:var(--mono);font-size:12px;color:var(--muted);max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:var(--r-control);padding:var(--s2) var(--s3)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding:var(--gutter)}.modal .card{max-width:480px;width:100%;padding:0;display:flex;flex-direction:column;overflow:hidden}.modal h1{font-size:18px;line-height:24px;margin:0;padding:var(--gutter) var(--gutter) var(--s3)}.modal .mbody{padding:0 var(--gutter) var(--s5)}.modal .mbody p{margin:0;color:var(--muted)}.modal .mfoot{padding:var(--s3) var(--gutter) var(--gutter);border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:var(--s2)}
.tokenbox{font-family:var(--mono);font-size:12px;line-height:18px;padding:var(--s3);border:1px solid var(--line);border-radius:var(--r-control);background:var(--bg);word-break:break-all;white-space:pre-wrap}
.divider{display:flex;align-items:center;gap:var(--s3);color:var(--muted);font-size:12px}.divider::before,.divider::after{content:"";flex:1;border-top:1px solid var(--line)}
.sep{border-top:1px solid var(--line)}.kv{display:grid;grid-template-columns:200px minmax(0,1fr);gap:var(--s2) var(--s4);font-size:13px}.kv dt{color:var(--muted);margin:0}.kv dd{margin:0}
</style></head>
<body><div id="app"></div><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
const $=(s,r)=>(r||document).querySelector(s);
const esc=(s)=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(t)=>t?new Date(t).toLocaleString():'—';
const rel=(t)=>{const d=(new Date(t)-Date.now())/864e5;if(d<0)return 'expired';if(d<1)return 'in '+Math.round(d*24)+'h';if(d<60)return 'in '+Math.round(d)+' days';return 'in '+Math.round(d/30)+' months'};
const ICON={lock:'<rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path>',people:'<circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7"></path><path d="M17.5 13.5A6.5 6.5 0 0 1 21.5 20"></path>',eye:'<path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6z"></path><circle cx="12" cy="12" r="3"></circle>',download:'<path d="M12 3v12M6 11l6 6 6-6M4 21h16"></path>',play:'<path d="M7 4l12 8-12 8z"></path>',x:'<path d="M6 6l12 12M18 6L6 18"></path>',mic:'<rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path>',plus:'<path d="M12 5v14M5 12h14"></path>',screen:'<rect x="3" y="4" width="18" height="13" rx="2"></rect><path d="M8 21h8M12 17v4"></path>'};
const ic=(n,cls='')=>`<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;
const count=(n,icon,word)=>`<span class="count" title="${n} ${word}${n===1?'':'s'}">${ic(icon)}<b>${n}</b></span>`;
let token=sessionStorage.getItem('vault_token')||'';let me=null;
// A signed-in link (printed when the server starts) carries the token in the URL fragment, which never reaches the server or its logs. Use it once and drop it from the address bar.
// Also handled on hashchange: pasting the link into a tab that already shows the console does not reload the page.
function tokenFromHash(){const m=location.hash.match(/(?:^#|&)token=([^&]+)/);if(!m)return false;token=decodeURIComponent(m[1]);sessionStorage.setItem('vault_token',token);history.replaceState(null,'',location.pathname);return true}
tokenFromHash();
window.addEventListener('hashchange',async()=>{if(!tokenFromHash())return;try{me=await api('/me')}catch{token=''}view={page:'list'};render()});let view={page:'list'};let liveTimer=null;let left=null;
function toast(m,ms){const t=$('#toast');t.innerHTML='<span></span><button type="button" class="x" aria-label="Dismiss">\u00d7</button>';t.firstChild.textContent=m;t.classList.add('show');clearTimeout(t._h);const hide=()=>t.classList.remove('show');t._h=setTimeout(hide,ms||Math.min(8000,Math.max(3000,1000+m.length*50)));t.lastChild.onclick=hide;t.onmouseenter=()=>clearTimeout(t._h);t.onmouseleave=()=>{t._h=setTimeout(hide,1500)}}
async function api(path,opts={}){const h={'Content-Type':'application/json',...(opts.headers||{})};if(token)h.Authorization='Bearer '+token;const r=await fetch('/api'+path,{...opts,headers:h});if(r.status===401){const had=!!me;me=null;if(had)render();throw new Error('Unauthorized')}const ct=r.headers.get('content-type')||'';const body=ct.includes('json')?await r.json():await r.text();if(!r.ok)throw new Error(body.error||r.statusText);return body}
async function copy(t){try{await navigator.clipboard.writeText(t);toast('Copied')}catch{prompt('Copy this link',t)}}
async function download(path,name){const r=await fetch('/api'+path,{headers:{Authorization:'Bearer '+token}});if(!r.ok){alert('Export failed');return}const blob=await r.blob();const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click()}
async function blobUrl(path){const r=await fetch('/api'+path,{headers:{Authorization:'Bearer '+token}});return URL.createObjectURL(await r.blob())}
function b64(u8){let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)}
function walk(entry,prefix,out){return new Promise(res=>{if(entry.isFile)entry.file(f=>{out.push({path:prefix+f.name,file:f});res()});else{const r=entry.createReader();const all=[];const read=()=>r.readEntries(async es=>{if(!es.length){for(const e of all)await walk(e,prefix+entry.name+'/',out);res()}else{all.push(...es);read()}});read()}})}
async function filesFromDrop(e){const files=[];for(const it of e.dataTransfer.items||[]){const en=it.webkitGetAsEntry&&it.webkitGetAsEntry();if(en)await walk(en,'',files);else if(it.kind==='file')files.push({path:it.getAsFile().name,file:it.getAsFile()})}if(!files.length)for(const f of e.dataTransfer.files)files.push({path:f.name,file:f});return files}
function uploadXhr(method,path,file,headers,onProgress){return new Promise((res,rej)=>{const x=new XMLHttpRequest();x.open(method,'/api'+path);x.setRequestHeader('Authorization','Bearer '+token);for(const k in headers)x.setRequestHeader(k,headers[k]);x.upload.onprogress=e=>{if(e.lengthComputable&&onProgress)onProgress(e.loaded/e.total)};x.onload=()=>{let b={};try{b=JSON.parse(x.responseText)}catch{}if(x.status>=200&&x.status<300)res(b);else rej(new Error(b.error||x.statusText))};x.onerror=()=>rej(new Error('Upload failed'));x.send(file)})}
function stopLive(){if(liveTimer){clearInterval(liveTimer);liveTimer=null}}

// ---------- shell: nav + footer ----------
function shell(content,active){return `<nav class="nav"><a class="brand" href="#" data-nav="list">${ic('lock','lg')}Prototype Vault</a><div class="links"><a href="#" data-nav="list" class="${active==='list'?'on':''}">Prototypes</a><a href="#" data-nav="new" class="${active==='new'?'on':''}">New share</a><a href="#" data-nav="server" class="${active==='server'?'on':''}">Server</a></div><span class="spacer"></span><span class="hint">${me.server.encryptionAtRest?'Encrypted at rest':'<span style="color:var(--warn)">Not encrypted at rest</span>'} · ${me.server.sso?'SSO':'personal links'}</span><a href="#" class="me ${active==='account'?'on':''}" data-nav="account" title="Account"><span class="avatar">${esc(initials(me.identity.who))}</span><span>${esc(me.identity.who)}</span></a></nav><div class="wrap"><div class="content">${content}</div><footer class="footer"><span>Prototype Vault ${esc(me.server.version)} · self-hosted, nothing leaves this server</span><span class="spacer"></span><a href="/docs/readme" target="_blank">Help</a><a href="/docs/security" target="_blank">Security overview</a><a href="/docs/deployment" target="_blank">Deployment</a><a href="/docs/design-system" target="_blank">Design system</a></footer></div>`}
function wireShell(){document.querySelectorAll('[data-nav]').forEach(a=>a.onclick=e=>{e.preventDefault();view={page:a.dataset.nav};render()})}
function ask(title,body,okLabel,danger){return new Promise(res=>{const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="card" role="dialog" aria-modal="true"><h1>${title}</h1><div class="mbody"><p>${body}</p></div><div class="mfoot"><button class="btn" id="mNo">Cancel</button><button class="btn ${danger?'danger':'primary'}" id="mYes">${esc(okLabel)}</button></div></div>`;document.body.appendChild(m);const done=v=>{m.remove();res(v)};m.querySelector('#mNo').onclick=()=>done(false);m.querySelector('#mYes').onclick=()=>done(true);m.onclick=e=>{if(e.target===m)done(false)};m.querySelector('#mYes').focus()})}
const initials=(w)=>{const s=String(w||'').replace(/@.*/,'').replace(/[._-]+/g,' ').trim().split(' ').filter(Boolean);return s.length?(s[0][0]+(s[1]?s[1][0]:'')).toUpperCase():'A'}
function signOut(){sessionStorage.removeItem('vault_token');token='';me=null;render()}
function render(){stopLive();const app=$('#app');window.scrollTo(0,0);if(left)return renderLeft(app);if(!me)return renderLogin(app);if(view.page==='list')return renderList(app);if(view.page==='new')return renderNew(app);if(view.page==='share')return renderShare(app);if(view.page==='server')return renderServer(app);if(view.page==='account')return renderAccount(app)}

async function renderLogin(app){let a={};try{a=await (await fetch('/api/auth')).json()}catch{}
  const ssoBlock=a.sso?(a.ssoEmail&&!a.ssoAdmin?`<div class="warn">You are signed in as <b>${esc(a.ssoEmail)}</b> through your company sign-in, but that address is not on this server's admin list. Ask whoever runs the vault to add it (ADMIN_EMAILS), then reload.</div>`:`<div class="stack" style="gap:var(--s2)"><button class="btn primary" type="button" id="ssoGo" style="width:100%">Continue with company sign-in</button><div class="hint">Uses your company identity provider through the proxy in front of this server. No separate password.</div></div><div class="divider">or</div>`):'';
  app.innerHTML=`<div class="gate"><div class="card"><div class="lock">${ic('lock','lg')}</div><h1>Sign in</h1><p>Prototype Vault is self-hosted by your company. There is nothing to sign up for: access is granted by whoever runs the server.</p><div class="stack" style="gap:var(--s4)">${ssoBlock}${a.serverToken||!a.sso?`<form class="stack" id="loginForm" style="gap:var(--s2)"><div class="field"><label>Admin token</label><div class="form"><input type="password" id="tok" placeholder="Paste the token" autofocus autocomplete="current-password"><button class="btn primary" type="submit">Sign in</button></div></div><div class="hint">Printed in the terminal where the server runs, along with a link that signs you in without pasting. For a server you run yourself, or as a fallback when company sign-in is not configured.</div><p id="err" style="color:var(--danger);margin:0"></p></form>`:''}</div><footer>Every sign-in and every failed attempt is recorded in the access log.</footer></div></div>`;
  if($('#ssoGo'))$('#ssoGo').onclick=()=>location.reload();
  if($('#loginForm'))$('#loginForm').onsubmit=async e=>{e.preventDefault();token=$('#tok').value.trim();try{me=await api('/me');sessionStorage.setItem('vault_token',token);render()}catch{token='';$('#err').textContent='That token was not accepted.'}}}

function renderLeft(app){app.innerHTML=`<div class="gate"><div class="card"><div class="lock">${ic('lock','lg')}</div><h1>You have left</h1><p>${left.shares} prototype${left.shares===1?'':'s'} you shared ${left.shares===1?'was':'were'} deleted with all their files, links, recordings and results, and ${left.tokens} connected tool${left.tokens===1?' was':'s were'} disconnected.</p><p>${left.sso?'Your company sign-in still exists; it is managed by your company, not by this server. Ask whoever runs the vault to remove you from the admin list so this console no longer opens for you.':'Nothing else about you is kept here.'}</p><footer>Access-log entries mentioning you stay for the retention period, because they are security records.</footer></div></div>`}

// ---------- account: who you are, connected tools (personal access tokens), leave, sign out ----------
async function renderAccount(app){app.innerHTML=shell(`<div class="pagehead"><h1>Account</h1></div><div id="acct"><p class="muted">Loading…</p></div>`,'account');wireShell();
  const [{tokens},{activity}]=await Promise.all([api('/tokens'),api('/activity')]);const id=me.identity;const s=me.server;const active=tokens.filter(t=>!t.revokedAt);
  const how=id.kind==='sso'?`Company sign-in (${esc(s.sso?'identity header from your proxy':'SSO')})`:id.kind==='server-token'?'Server admin token':`Personal access token${id.tokenId?' · '+esc((tokens.find(t=>t.id===id.tokenId)||{}).name||''):''}`;
  $('#acct').innerHTML=`<div class="stack" style="gap:var(--s6)">
  <div class="card"><div class="section"><h3>You</h3><dl class="kv"><dt>Signed in as</dt><dd>${esc(id.who)}</dd><dt>How</dt><dd>${how}</dd><dt>This browser</dt><dd>${id.kind==='sso'?'Stays signed in while your company session lasts.':'Signed in until you close this tab or sign out.'}</dd><dt>Admins on this server</dt><dd>${[s.adminEmails.length?esc(s.adminEmails.join(', ')):'',s.serverToken?'whoever holds the server admin token':''].filter(Boolean).join(' · ')||'—'}</dd></dl>
    <div class="row">${id.kind!=='sso'?`<button class="btn" id="out">Sign out</button>`:''}${s.ssoLogoutUrl?`<a class="btn" href="${esc(s.ssoLogoutUrl)}">Sign out of company sign-in</a>`:id.kind==='sso'?`<span class="hint">To sign out, sign out of your company identity provider. Ask whoever runs the vault to set SSO_LOGOUT_URL for a button here.</span>`:''}</div></div></div>
  <div class="card"><div class="section"><h3>Connected tools</h3><div class="hint">Claude Code, the CLI and the MCP server publish with a personal access token. Each tool gets its own, so you can disconnect one without touching the others. Disconnecting is immediate; nothing already shared changes.</div>
    ${active.length?`<table><thead><tr><th>Tool</th><th style="width:170px">Connected</th><th style="width:170px">Last used</th><th>Owner</th><th class="actions"></th></tr></thead><tbody>${active.map(t=>`<tr><td><b>${esc(t.name)}</b>${t.current?' <span class="pill active">this session</span>':''}<br><span class="muted mono">${esc(t.prefix)}…</span></td><td>${fmt(t.createdAt)}</td><td>${t.lastUsedAt?fmt(t.lastUsedAt):'Never'}</td><td class="muted">${esc(t.owner)}</td><td class="actions"><button class="btn small danger" data-disc="${t.id}" data-name="${esc(t.name)}">Disconnect</button></td></tr>`).join('')}</tbody></table>`:'<p class="muted" style="margin:0">No tools connected yet.</p>'}
    <div class="row"><input type="text" id="tname" placeholder="Name the tool, e.g. Claude Code on my laptop" style="flex:1;width:auto" maxlength="60"><button class="btn primary" id="tadd">Connect a tool</button></div><div id="tnew"></div>
    ${tokens.length>active.length?`<details><summary class="hint" style="cursor:pointer">Disconnected (${tokens.length-active.length})</summary><table style="margin-top:var(--s2)"><tbody>${tokens.filter(t=>t.revokedAt).map(t=>`<tr class="muted"><td>${esc(t.name)}</td><td style="width:170px">connected ${fmt(t.createdAt)}</td><td style="width:170px">disconnected ${fmt(t.revokedAt)}</td><td>${esc(t.owner)}</td></tr>`).join('')}</tbody></table></details>`:''}</div></div>
  <div class="card"><div class="section"><h3>Leave Prototype Vault</h3>${id.kind==='server-token'||id.who==='admin-token'?`<div class="hint">You are using the shared server admin token, which is not a personal account. To stop using this, delete your shares from the Prototypes page and ask whoever runs the server to rotate the token.</div>`:`<div class="hint">If you no longer want to use this, you can delete everything you made here in one go: the ${me.mine.shares} prototype${me.mine.shares===1?'':'s'} you shared (files, viewer links, recordings, feedback and results) and the ${me.mine.tokens} connected tool${me.mine.tokens===1?'':'s'}. It cannot be undone.</div><div class="row"><button class="btn danger" id="leave">Delete everything I made and leave</button></div>`}</div></div>
  <div class="card"><div class="section"><h3>Recent account activity</h3>${activity.length?`<ul class="timeline">${activity.slice(0,30).map(a=>`<li><span class="ts">${esc(a.ts.replace('T',' ').slice(0,19))}</span><b>${esc(a.type)}</b> ${a.name?esc(a.name):''} ${a.path?'<span class="mono">'+esc(a.path)+'</span>':''} <span class="muted">${esc(a.ip||'')}${a.by?' by '+esc(a.by):''}</span></li>`).join('')}</ul>`:'<p class="muted" style="margin:0">Nothing yet.</p>'}<div class="hint">Sign-ins, failed attempts, tools connected or disconnected, shares created, revoked or deleted. The full log is in the data directory.</div></div></div></div>`;
  if($('#out'))$('#out').onclick=signOut;
  if($('#leave'))$('#leave').onclick=async()=>{if(!await ask('Leave Prototype Vault?',`This deletes the ${me.mine.shares} prototype${me.mine.shares===1?'':'s'} you shared, with their files, viewer links, recordings, feedback and results, disconnects your ${me.mine.tokens} tool${me.mine.tokens===1?'':'s'}, and signs you out. It cannot be undone. ${id.kind==='sso'?'Your company sign-in is managed by your company; ask IT to remove you from the admin list as well.':''}`,'Delete everything and leave',true))return;try{left=await api('/me/leave',{method:'POST'});sessionStorage.removeItem('vault_token');token='';me=null;render()}catch(e){alert(e.message)}};
  if(view.newToken){showNewToken(view.newToken);view.newToken=null}
  $('#tadd').onclick=async()=>{const name=$('#tname').value.trim();if(!name){$('#tname').focus();return}try{const r=await api('/tokens',{method:'POST',body:JSON.stringify({name})});view.newToken=r;render()}catch(e){alert(e.message)}};$('#tname').onkeydown=e=>{if(e.key==='Enter')$('#tadd').click()};
  $('#acct').querySelectorAll('[data-disc]').forEach(b=>b.onclick=async()=>{if(!await ask(`Disconnect ${esc(b.dataset.name)}?`,'It stops working right away. To use that tool again you would connect it with a new token. Prototypes it already shared are not affected.','Disconnect',true))return;await api('/tokens/'+b.dataset.disc,{method:'DELETE'});toast('Disconnected');if(b.dataset.disc===me.identity.tokenId){signOut();return}render()})}
function showNewToken(r){const url=me.server.publicUrl;$('#tnew').innerHTML=`<div class="card" style="background:var(--bg);margin-top:var(--s3)"><div class="stack" style="gap:var(--s3)"><div><b>${esc(r.item.name)}</b> is connected. Copy the token now; it is shown only once.</div><div class="tokenbox" id="tokval">${esc(r.token)}</div><div class="row"><button class="btn primary" id="tcopy">Copy token</button><button class="btn" id="tcli">Copy CLI setup</button><button class="btn" id="tmcp">Copy Claude Code setup</button></div><div class="hint">CLI and MCP read <span class="mono">VAULT_URL</span> and <span class="mono">VAULT_ADMIN_TOKEN</span>. In Claude Code: <span class="mono">claude mcp add prototype-vault -e VAULT_URL=${esc(url)} -e VAULT_ADMIN_TOKEN=… -- node "${esc(me.server.mcpPath)}"</span> (that path is where the MCP server lives on the machine running the vault; use your own copy's path if this vault runs elsewhere).</div></div></div>`;
  $('#tcopy').onclick=()=>copy(r.token);$('#tcli').onclick=()=>copy(`export VAULT_URL=${url} VAULT_ADMIN_TOKEN=${r.token}`);$('#tmcp').onclick=()=>copy(`claude mcp add prototype-vault -e VAULT_URL=${url} -e VAULT_ADMIN_TOKEN=${r.token} -- node "${me.server.mcpPath}"`)}

async function renderList(app){app.innerHTML=shell(`<div class="pagehead"><h1>Prototypes</h1><span class="spacer"></span><button class="btn primary" id="new">+ New share</button></div><div class="card shares" id="list"><p class="muted" style="margin:0">Loading…</p></div>`,'list');wireShell();
  $('#new').onclick=()=>{view={page:'new'};render()};
  const {shares}=await api('/shares');const l=$('#list');

function wireIntroEditor(shareId,pendingRef){$('#introKind').querySelectorAll('button').forEach(b=>b.onclick=()=>{$('#introKind').querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');const k=b.dataset.k;$('#introTextField').hidden=k==='default';$('#introMediaField').hidden=!(k==='audio'||k==='video');if($('#subsField'))$('#subsField').hidden=k!=='video'});

  if(view.tab==='links')return tabLinks(t,share);if(view.tab==='activity')return tabActivity(t,share);if(view.tab==='results')return tabResults(t,share);if(view.tab==='settings')return tabSettings(t,share)}

function tabLinks(t,share){t.innerHTML=`<div class="stack"><div class="hint">Send each person their own link through your normal channel. A link identifies who opened it, and can be revoked or rotated on its own. <b>App link</b> opens the same prototype in the Prototype Vault viewer app (see the README), whose window is excluded from screenshots and screen sharing on macOS and Windows.</div>
  <table><thead><tr><th>Viewer</th><th class="num">Opens</th><th style="width:160px">Last seen</th><th>Personal link</th><th class="actions"></th></tr></thead><tbody>${share.viewers.map(v=>`<tr class="${v.revoked?'muted':''}"><td><b>${esc(v.name)}</b><br><span class="muted">${esc(v.email)}</span>${v.source==='sso'?' <span class="pill">sso</span>':''}${v.revoked?' <span class="pill revoked">revoked</span>':''}</td><td class="num">${v.opens}${v.maxOpens?' / '+v.maxOpens:''}</td><td>${fmt(v.lastSeenAt)}</td><td>${v.link?`<div class="link">${esc(v.link)}</div>`:'—'}</td><td class="actions"><span class="row" style="flex-wrap:nowrap">${v.link?`<button class="btn small" data-copy="${esc(v.link)}">Copy</button><button class="btn small" data-copy="prototypevault://open?u=${encodeURIComponent(v.link)}" title="Same link, for the Prototype Vault viewer app: it blacks out screenshots and screen sharing on macOS and Windows">App link</button><button class="btn small" data-rotate="${v.id}" title="Issue a new link; the old one stops working">Rotate</button><button class="btn small danger" data-revoke="${v.id}">Revoke</button>`:''}</span></td></tr>`).join('')}</tbody></table>
  <div class="row"><input type="text" id="nv" placeholder="Add viewer: Name <email@company.com>" style="flex:1;width:auto"><button class="btn" id="add">Add viewer</button>${share.viewers.length>1?`<button class="btn" id="copyAll">Copy all links</button>`:''}</div></div>`;
  t.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copy(b.dataset.copy));
  t.querySelectorAll('[data-rotate]').forEach(b=>b.onclick=async()=>{if(!confirm('Issue a new link? The current one stops working.'))return;await api(`/shares/${share.id}/viewers/${b.dataset.rotate}/rotate`,{method:'POST'});render()});
  t.querySelectorAll('[data-revoke]').forEach(b=>b.onclick=async()=>{if(!confirm('Revoke this viewer?'))return;await api(`/shares/${share.id}/viewers/${b.dataset.revoke}`,{method:'DELETE'});render()});
  $('#add').onclick=async()=>{const s=$('#nv').value.trim();if(!s)return;try{await api(`/shares/${share.id}/viewers`,{method:'POST',body:JSON.stringify({viewers:[s]})});render()}catch(e){alert(e.message)}};$('#nv').onkeydown=e=>{if(e.key==='Enter')$('#add').click()};
  if($('#copyAll'))$('#copyAll').onclick=()=>copy(share.viewers.filter(v=>v.link).map(v=>`${v.name} <${v.email}>: ${v.link}`).join('\n'))}

async function tabActivity(t,share){const {audit}=await api('/shares/'+share.id+'/audit');t.innerHTML=audit.length?`<ul class="timeline">${audit.slice().reverse().map(a=>`<li><span class="ts">${esc(a.ts.replace('T',' ').slice(0,19))}</span><b>${esc(a.type)}</b> ${a.email?esc(a.email):''} ${a.reason?'('+esc(a.reason)+')':''} <span class="muted">${esc(a.ip||'')}${a.by?' by '+esc(a.by):''}</span></li>`).join('')}</ul>`:'<p class="muted">No activity yet.</p>'}

async function tabResults(t,share){const draw=async()=>{const [{feedback},sum,fresh]=await Promise.all([api('/shares/'+share.id+'/feedback'),api('/shares/'+share.id+'/summary'),api('/shares/'+share.id)]);const live=!!liveTimer;const recs=fresh.share.recordings||[];
  t.innerHTML=`<div class="stack" style="gap:var(--s6)">
  <div class="head-row"><div class="stats"><div class="stat"><b>${sum.viewers.length}</b><span>testers with sessions</span></div><div class="stat"><b>${sum.eventCount}</b><span>interactions</span></div><div class="stat"><b>${sum.feedbackCount}</b><span>feedback notes</span></div><div class="stat"><b>${recs.length}</b><span>voice recordings</span></div><div class="stat"><b>${sum.noteCount}</b><span>moderator notes</span></div></div>
  <div class="row"><button class="btn small ${live?'primary':''}" id="live" title="Refresh every 5 seconds while a session runs">${live?'Live · on':'Live'}</button><button class="btn small" id="expMd">${ic('download')}Report (.md)</button><button class="btn small" id="expCsv">${ic('download')}Events (.csv)</button><button class="btn small" id="expJson">${ic('download')}Everything (.json)</button></div></div>
  ${sum.tasks.length?`<div class="section"><h3>Tasks and questions</h3><table><thead><tr><th style="width:90px">Type</th><th>Text</th><th style="width:170px">When</th><th class="num">Completed</th><th class="num">Stuck</th><th class="num">Answers</th></tr></thead><tbody>${sum.tasks.map(x=>`<tr><td>${x.kind==='question'?'Question':'Task'}</td><td>${x.index+1}. ${esc(x.task)}</td><td class="muted">${x.when.type==='start'?'At start':x.when.type==='after'?'After task '+(x.when.value+1):x.when.type==='screen'?'On '+esc(x.when.value):'After '+x.when.value+' min'}</td><td class="num" style="color:var(--ok)">${x.kind==='task'?x.done:'—'}</td><td class="num" style="color:var(--danger)">${x.kind==='task'?x.stuck:'—'}</td><td class="num">${x.kind==='question'?x.answers:'—'}</td></tr>`).join('')}</tbody></table></div>`:''}
  ${sum.viewers.length?`<div class="section"><h3>Per tester</h3><table><thead><tr><th>Tester</th><th class="num">Sessions</th><th class="num">Clicks</th><th class="num">Screens</th><th class="num">Errors</th><th style="width:150px">First</th><th style="width:150px">Last</th><th>Most visited</th></tr></thead><tbody>${sum.viewers.map(v=>`<tr><td>${esc(v.viewer)}<br><span class="muted">${esc(v.email)}</span></td><td class="num">${v.sessions}</td><td class="num">${v.clicks}</td><td class="num">${v.pageviews}</td><td class="num">${v.errors}</td><td>${fmt(v.first)}</td><td>${fmt(v.last)}</td><td class="mono">${esc(Object.entries(v.paths).sort((a,b)=>b[1]-a[1]).slice(0,3).map(p=>p[0]+' ('+p[1]+')').join(', '))}</td></tr>`).join('')}</tbody></table></div>`:''}
  ${recs.length?`<div class="section"><h3>Voice recordings (think-aloud)</h3><table><thead><tr><th>Tester</th><th style="width:170px">Started</th><th class="num">Size</th><th>Listen</th><th class="actions"></th></tr></thead><tbody>${recs.map(r=>`<tr><td>${esc(r.viewer||'')}<br><span class="muted">${esc(r.email||'')}</span></td><td>${fmt(r.startedAt)}</td><td class="num">${(r.size/1048576).toFixed(1)} MB</td><td><audio controls preload="none" data-rec="${r.session}" style="width:100%;max-width:360px"></audio></td><td class="actions"><span class="row" style="flex-wrap:nowrap"><button class="btn small" data-recdl="${r.session}">${ic('download')}</button><button class="btn small danger" data-recrm="${r.session}">Delete</button></span></td></tr>`).join('')}</tbody></table></div>`:''}
  <div class="section"><h3>Moderator note</h3><div class="row"><select id="noteWho" style="width:220px">${['<option value="">General</option>'].concat(share.viewers.map(v=>`<option value="${v.id}">${esc(v.name)}</option>`)).join('')}</select><input type="text" id="noteText" placeholder="What you observed…" style="flex:1;width:auto"><button class="btn" id="noteAdd">Add note</button></div></div>
  <div class="section"><h3>Feedback, answers, task notes and moderator notes</h3>${feedback.length?`<ul class="timeline">${feedback.slice().reverse().map(f=>`<li><span class="ts">${esc(f.ts.replace('T',' ').slice(0,16))}</span><b>${esc(f.kind==='note'?'Moderator':f.viewer)}</b> ${f.kind==='task'?(f.result==='answer'?`<span class="pill">answer</span> question ${f.taskIndex+1}`:`<span class="pill ${f.result==='done'?'active':'revoked'}">${f.result==='done'?'completed':'stuck'}</span> task ${f.taskIndex+1}`):''}${f.kind==='note'&&f.viewer?` about ${esc(f.viewer)}`:''}${f.location?` <span class="loc" title="Where they were in the prototype">${ic('screen')}on <span class="mono">${esc(f.location)}</span></span>`:''}${f.text?`<div style="margin-top:var(--s1);white-space:pre-wrap">${esc(f.text)}</div>`:''}</li>`).join('')}</ul>`:'<p class="muted" style="margin:0">Nothing yet.</p>'}</div></div>`;
  $('#expMd').onclick=()=>download('/shares/'+share.id+'/report','report-'+share.id+'.md');$('#expCsv').onclick=()=>download('/shares/'+share.id+'/events?format=csv','events-'+share.id+'.csv');$('#expJson').onclick=()=>download('/shares/'+share.id+'/report?format=json','share-'+share.id+'.json');
  $('#live').onclick=()=>{if(liveTimer)stopLive();else liveTimer=setInterval(draw,5000);draw()};
  t.querySelectorAll('audio[data-rec]').forEach(a=>{a.onplay=async()=>{if(!a.src){a.src=await blobUrl('/shares/'+share.id+'/recordings/'+a.dataset.rec);a.play()}}});
  t.querySelectorAll('[data-recdl]').forEach(b=>b.onclick=()=>download('/shares/'+share.id+'/recordings/'+b.dataset.recdl,'voice-'+b.dataset.recdl+'.webm'));
  t.querySelectorAll('[data-recrm]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this recording?'))return;await api('/shares/'+share.id+'/recordings/'+b.dataset.recrm,{method:'DELETE'});draw()});
  $('#noteAdd').onclick=async()=>{const text=$('#noteText').value.trim();if(!text)return;await api('/shares/'+share.id+'/notes',{method:'POST',body:JSON.stringify({text,viewerId:$('#noteWho').value||undefined})});toast('Note added');draw()};$('#noteText').onkeydown=e=>{if(e.key==='Enter')$('#noteAdd').click()}};
  await draw();if(share.mode==='moderated'&&!liveTimer){liveTimer=setInterval(draw,5000);draw()}}

function tabSettings(t,share){t.innerHTML=`<div class="detail-cols"><div class="stack" style="gap:var(--s6)">
  <div class="section"><h3>Share</h3><div class="field"><label>Name</label><input type="text" id="sName" value="${esc(share.name)}"></div>${modeSeg(share.mode)}<div class="stack" id="testSetup">${taskEditor(share.tasks)}${optionChecks(share)}</div><div class="field"><label>Passcode (blank keeps the current one, "none" removes it)</label><input type="text" id="sPass" autocomplete="off"></div>
  ${me.server.sso?`<div class="field"><label>SSO: also allow these email domains (comma separated)</label><input type="text" id="sDomains" value="${esc(share.ssoAllow.domains.join(', '))}"></div>`:''}</div>
  ${introEditor(share.intro,share)}
  <div class="field"><label>Notes</label><textarea id="sNotes" style="min-height:64px">${esc(share.notes)}</textarea></div>
  <div class="row"><button class="btn primary" id="save">Save</button></div></div>
  <div class="stack" style="gap:var(--s6)"><div class="section"><h3>Files</h3><div class="field"><label>Replace prototype files</label><div class="drop" id="drop2">Drop a folder here, or click to choose<input type="file" id="fileR" multiple webkitdirectory></div><div class="hint" id="rstat"></div></div>
  <div class="field"><label>Files in this share (${share.filePaths.length}) · opens <span class="mono">${esc(share.entry||'')}</span></label><div class="filelist">${share.filePaths.map(esc).join('<br>')||'—'}</div></div></div>
  <div class="section sep" style="padding-top:var(--s5)"><h3>Danger zone</h3><div class="row"><button class="btn danger" id="del">Delete share and all data</button></div><div class="hint">Removes the files, recordings, viewers, access log, feedback and recorded events. Cannot be undone.</div></div></div></div>`;
  wireModeSeg();wireTaskEditor();wireOptions();wireIntroEditor(share.id,null);
  $('#save').onclick=async()=>{const body={name:$('#sName').value,mode:modeValue(),tasks:taskValue(),notes:$('#sNotes').value,intro:introValue(),...optionValues()};const p=$('#sPass').value.trim();if(p==='none')body.passcode='';else if(p)body.passcode=p;if($('#sDomains'))body.ssoAllow={emails:share.ssoAllow.emails,domains:$('#sDomains').value.split(',').map(s=>s.trim()).filter(Boolean)};try{await api('/shares/'+share.id,{method:'PATCH',body:JSON.stringify(body)});toast('Saved');render()}catch(e){alert(e.message)}};
  const d2=$('#drop2');d2.onclick=e=>{if(e.target.tagName!=='INPUT')$('#fileR').click()};d2.ondragover=e=>{e.preventDefault()};
  const replace=async(list)=>{$('#rstat').textContent='Uploading…';try{const files=[];for(const {path,file} of list){if(/(^|\/)(node_modules|\.git|__MACOSX)\//.test(path)||/\.DS_Store$/.test(path))continue;files.push({path,contentBase64:b64(new Uint8Array(await file.arrayBuffer()))})}await api('/shares/'+share.id+'/bundle',{method:'PUT',body:JSON.stringify({files})});toast('Files replaced');render()}catch(e){$('#rstat').textContent=e.message}};
  d2.ondrop=async e=>{e.preventDefault();replace(await filesFromDrop(e))};$('#fileR').onchange=e=>replace([...e.target.files].map(f=>({path:f.webkitRelativePath||f.name,file:f})));
  $('#del').onclick=async()=>{if(!confirm('Delete this share and every record attached to it?'))return;await api('/shares/'+share.id,{method:'DELETE'});toast('Deleted');view={page:'list'};render()}}

(async()=>{try{me=await api('/me')}catch{token=''}render()})();
})();
</script></body></html>
